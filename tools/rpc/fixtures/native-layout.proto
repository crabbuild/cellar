message Outer { Wide absent = 1; }
message Batch { repeated Outer values = 1; }

message Variant {
  oneof value {
    Wide wide = 1;
    Wide other = 2;
  }
}
message Variants { repeated Variant values = 1; }
message Mapped { map<string, Outer> values = 1; }

// The wide alternative inflates the native oneof even when only next is sent.
message RecursiveWide {
  oneof value {
    Wide wide = 1;
    RecursiveNext next = 2;
  }
}
message RecursiveNext {
  Wide absent = 1;
  repeated RecursiveWide children = 2;
}
message RecursiveBatch { repeated RecursiveWide values = 1; }
