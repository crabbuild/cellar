# Modified for Cellar from Celld.
[package]
repository = "https://github.com/crabbuild/cellar"
name = "cellar"
default-run = "cellar"
autoexamples = false
version = "0.6.2"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"


[lib]
path = "lib.rs"

[[bin]]
name = "cellar"
path = "cli/main.rs"

[[bin]]
name = "cellar-native-counter"
path = "../../examples/native-counter/main.rs"

[[bin]]
name = "cellar-native-websocket"
path = "../../examples/native-websocket/main.rs"

[[bin]]
name = "cellar-native-container"
path = "../../examples/native-container/main.rs"

[[bin]]
name = "cellar-native-examples"
path = "../../examples/main.rs"

[[bin]]
name = "cellar-example-embedded"
path = "../../examples/embedded-node/main.rs"

[[bin]]
name = "cellar-example-container-peer"
path = "../../examples/native-container/server.rs"

[[bin]]
name = "cellar-perf-cells"
path = "../../tools/perf/cells.rs"

[[bin]]
name = "cellar-perf-load"
path = "../../tools/perf/load.rs"

[[bin]]
name = "cellar-perf-fault-cells"
path = "../../tools/perf/fault_cells.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(cellar_internal_tests)", "cfg(cellar_proxy_internals)"]

[lints.clippy]
disallowed_macros = "forbid"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cellar-logic.workspace = true
cellar-native.workspace = true
cellar-ltx = { workspace = true, features = ["s3"] }
encoding_rs.workspace = true
ed25519-dalek.workspace = true
fastwebsockets.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
glob.workspace = true
lol_html.workspace = true
hmac.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
indexmap.workspace = true
md-5.workspace = true
notify.workspace = true
nu-ansi-term.workspace = true
object_store = { workspace = true, features = ["aws", "azure", "gcp"] }
parquet.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream", "json"] }
rusqlite = { workspace = true, features = ["backup", "bundled", "hooks", "serialize"] }
sqlite-vec.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
tikv-jemalloc-ctl.workspace = true
tikv-jemallocator.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webpki-roots.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

[dev-dependencies]
lz4_flex.workspace = true
