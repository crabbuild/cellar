[package]
name = "cellar-python"
version = "0.6.2"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/crabbuild/cellar"
description = "Invocation-scoped embedded CPython adapter for Cellar"

[lib]
path = "lib.rs"

[features]
default = []
embed = ["dep:pyo3", "dep:pyo3-build-config", "dep:libc", "dep:cellar-logic", "dep:cellar-guest"]

[[bin]]
name = "cellar-python-example"
path = "../../examples/python/main.rs"
required-features = ["embed"]

[[bin]]
name = "cellar-python-fastapi"
path = "../../examples/python-fastapi/main.rs"
required-features = ["embed"]

[[bin]]
name = "cellar-python-agent"
path = "../../examples/python-agent/main.rs"
required-features = ["embed"]

[dependencies]
cellar-guest = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
cellar.workspace = true
cellar-logic = { workspace = true, optional = true }
futures-util.workspace = true
libc = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
pyo3-build-config = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
object_store.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
tikv-jemallocator.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "python-baseline"
path = "../../tools/python/baseline.rs"

[[example]]
name = "python-fleet"
path = "../../tools/python/fleet.rs"
required-features = ["embed"]

[[example]]
name = "python-offered-load"
path = "../../tools/python/offered_load.rs"

[[test]]
name = "bridge"
path = "tests/bridge.rs"
harness = false
required-features = ["embed"]

[lints.clippy]
disallowed_macros = "forbid"

[[test]]
name = "startup"
path = "tests/startup.rs"
harness = false
required-features = ["embed"]
