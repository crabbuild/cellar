[package]
name = "cellar-fleetcare"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
publish = false
description = "Field-service application and repeatable Cellar performance workload"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
cellar.workspace = true
cellar-logic.workspace = true
futures-util.workspace = true
fastwebsockets.workspace = true
http-body-util.workspace = true
hyper.workspace = true
object_store = { workspace = true, features = ["aws"] }
reqwest = { workspace = true, features = ["rustls-tls", "stream", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tikv-jemallocator.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "fleetcare-embedded"
path = "src/bin/embedded.rs"

[[bin]]
name = "fleetcare-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "fleetcare-load"
path = "src/bin/load.rs"

[[bin]]
name = "fleetcare-publish"
path = "src/bin/publish.rs"
