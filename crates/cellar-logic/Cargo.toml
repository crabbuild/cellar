# Modified for Cellar from Celld.
[package]
repository = "https://github.com/crabbuild/cellar"
name = "cellar-logic"
version = "0.1.1"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
readme = "README.crates.io.md"
description = "Pure decision core and state transitions for Cellar durable cells"

# Pure decision core: no async, I/O, clocks, randomness, locks, or dependencies.
[lib]
path = "lib.rs"
test = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(cellar_internal_tests)"]
