[package]
name = "cellar-javascript"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Optional V8 and Node.js backends for Cellar JavaScript and TypeScript applications"
[lib]
path = "lib.rs"
[features]
default = []
embed = ["dep:v8", "dep:cellar-guest"]
node = ["dep:cellar-guest", "dep:getrandom", "dep:libc", "dep:sha2"]
[dependencies]
anyhow.workspace = true
base64.workspace = true
cellar.workspace = true
cellar-guest = { workspace = true, optional = true }
futures-util.workspace = true
getrandom = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
v8 = { workspace = true, optional = true }
[dev-dependencies]
cellar-container.workspace = true
tar.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
bytes.workspace = true
url.workspace = true
fastwebsockets.workspace = true
tempfile.workspace = true
reqwest.workspace = true
[[bin]]
name = "cellar-javascript-example"
path = "../../examples/javascript/main.rs"
required-features = ["embed"]

[[bin]]
name = "cellar-node-example"
path = "../../examples/node/main.rs"
required-features = ["node"]

[[bin]]
name = "cellar-pi-agent-example"
path = "../../examples/pi-agent/main.rs"
required-features = ["node"]

[[bin]]
name = "cellar-vercel-agent-example"
path = "../../examples/vercel-agent/main.rs"
required-features = ["node"]

[[bin]]
name = "cellar-javascript-perf"
path = "../../tools/perf/javascript/host.rs"
required-features = ["embed", "node"]

[[bin]]
name = "cellar-streaming-javascript"
path = "../../examples/streaming/javascript.rs"
required-features = ["embed"]

[[bin]]
name = "cellar-streaming-node"
path = "../../examples/streaming/node.rs"
required-features = ["node"]

[[bin]]
name = "cellar-bindings-node"
path = "../../examples/bindings/node.rs"
required-features = ["node"]

[[bin]]
name = "cellar-bindings-javascript"
path = "../../examples/bindings/javascript.rs"
required-features = ["embed"]
