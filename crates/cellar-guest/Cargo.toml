[package]
name = "cellar-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Shared native operation boundary for Cellar language adapters"
[lib]
path = "lib.rs"
[dependencies]
anyhow.workspace = true
base64.workspace = true
cellar.workspace = true
cellar-container.workspace = true
cellar-logic.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
