<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" role="img" aria-labelledby="title description">
  <title id="title">A successful write waits for durability proof</title>
  <desc id="description">A cell handler commits SQLite changes captured as LTX. Cellar requires ownership and durability proof from peer logs or bucket upload before releasing success. Missing proof refuses success, while a lost response can leave the outcome ambiguous.</desc>
  <defs>
    <style>text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }</style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="8" markerHeight="7" refX="9" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="880" height="375" rx="18" fill="#0f172a" />
  <rect width="880" height="375" rx="18" fill="url(#grid)" />
  <path d="M 205 181 H 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 420 181 H 460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 635 181 H 675" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="30" y="125" width="175" height="112" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="125" width="175" height="112" rx="12" fill="#102d3e" stroke="#22d3ee" stroke-width="1.5" />
  <text x="46" y="160" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="start">1 · Run code</text>
  <text x="46" y="191" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">Cell handler</text>
  <rect x="245" y="125" width="175" height="112" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="245" y="125" width="175" height="112" rx="12" fill="#282244" stroke="#a78bfa" stroke-width="1.5" />
  <text x="261" y="160" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="start">2 · Commit</text>
  <text x="261" y="191" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">SQLite → LTX</text>
  <rect x="460" y="125" width="175" height="112" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="460" y="125" width="175" height="112" rx="12" fill="#30291d" stroke="#fbbf24" stroke-width="1.5" />
  <text x="476" y="160" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="start">3 · Prove</text>
  <text x="476" y="191" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">Peer logs or</text>
  <text x="476" y="214" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">bucket upload</text>
  <rect x="675" y="125" width="175" height="112" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="675" y="125" width="175" height="112" rx="12" fill="#10352e" stroke="#34d399" stroke-width="1.5" />
  <text x="691" y="160" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="start">4 · Reply</text>
  <text x="691" y="191" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">Output gate</text>
  <text x="691" y="214" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">releases success</text>
  <rect x="30" y="280" width="820" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="280" width="820" height="65" rx="12" fill="#301f32" stroke="#fb7185" stroke-width="1.5" />
  <text x="50" y="307" fill="#fecdd3" font-size="16" font-weight="600" text-anchor="start">Missing proof or stale ownership prevents success.</text>
  <text x="50" y="331" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">A lost response can still be ambiguous; retries need an explicit contract.</text>
  <text x="30" y="42" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="start">Commit locally. Prove durability. Then reply.</text>
  <text x="30" y="73" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Successful writes pass an output gate before the response is released.</text>
</svg>
