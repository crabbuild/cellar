<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 385" role="img" aria-labelledby="title description">
  <title id="title">Named cells keep separate SQLite state</title>
  <desc id="description">The COUNTERS namespace routes alice and bob to different Counter cells. Each cell has its own SQLite state. Names retain their identities within a namespace when ownership moves.</desc>
  <defs>
    <style>text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }</style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="8" markerHeight="7" refX="9" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="880" height="385" rx="18" fill="#0f172a" />
  <rect width="880" height="385" rx="18" fill="url(#grid)" />
  <path d="M 260 215 H 320 V 152 H 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 320 215 V 277 H 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="30" y="155" width="230" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="155" width="230" height="120" rx="12" fill="#102d3e" stroke="#22d3ee" stroke-width="1.5" />
  <rect x="400" y="110" width="450" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="400" y="110" width="450" height="85" rx="12" fill="#10352e" stroke="#34d399" stroke-width="1.5" />
  <rect x="400" y="235" width="450" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="400" y="235" width="450" height="85" rx="12" fill="#10352e" stroke="#34d399" stroke-width="1.5" />
  <rect x="660" y="126" width="170" height="50" rx="12" fill="#282244" stroke="#a78bfa" stroke-width="1.5" />
  <rect x="660" y="251" width="170" height="50" rx="12" fill="#282244" stroke="#a78bfa" stroke-width="1.5" />
  <text x="145" y="191" fill="#e2e8f0" font-size="18" font-weight="600" text-anchor="middle">Your application</text>
  <text x="145" y="220" fill="#e2e8f0" font-size="16" font-weight="400" text-anchor="middle">/counters/{name}</text>
  <text x="145" y="246" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">COUNTERS namespace</text>
  <text x="338" y="139" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">alice</text>
  <text x="338" y="264" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">bob</text>
  <text x="422" y="143" fill="#e2e8f0" font-size="19" font-weight="600" text-anchor="start">Counter: alice</text>
  <text x="422" y="172" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Own SQLite state</text>
  <text x="422" y="268" fill="#e2e8f0" font-size="19" font-weight="600" text-anchor="start">Counter: bob</text>
  <text x="422" y="297" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Own SQLite state</text>
  <text x="745" y="158" fill="#ddd6fe" font-size="16" font-weight="400" text-anchor="middle">count = 4</text>
  <text x="745" y="283" fill="#ddd6fe" font-size="16" font-weight="400" text-anchor="middle">count = 1</text>
  <text x="30" y="355" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Names keep their identity within a namespace, even when owners change.</text>
  <text x="30" y="42" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="start">One business name. One durable cell.</text>
  <text x="30" y="73" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Model an account, cart, room or workflow as a cell.</text>
</svg>
