name: Snapshot catch-up diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Replay snapshot catch-up
        run: python3 tools/snapshot_catchup_diagnostic.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: snapshot-catchup-${{ github.run_id }}
          path: /tmp/cellar-snapshot-diagnostic
          retention-days: 7
