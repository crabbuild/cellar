name: Native repair load qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Verify suite and repeat held-repair traffic
        run: |
          python3 - <<'PYRUN'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'repair-evidence';root.mkdir()
          command=['cargo','test','-p','cellar','--all-features','--test','native_raft_multigroup','--locked']
          report={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'status':'running','runs':[]}
          (root/'report.json').write_text(json.dumps(report,indent=2))
          def run(label,args):
              started=time.monotonic_ns()
              with (root/(label+'.log')).open('w') as output:
                  result=subprocess.run(args,stdout=output,stderr=subprocess.STDOUT)
              report['runs'].append({'label':label,'returncode':result.returncode,'elapsed_ns':time.monotonic_ns()-started})
              if result.returncode:report['status']='failed'
              (root/'report.json').write_text(json.dumps(report,indent=2))
              result.check_returncode()
          selected=subprocess.check_output(command+['--','repair_budget_under_load','--exact','--list'],text=True)
          if selected.splitlines().count('repair_budget_under_load: test')!=1:raise SystemExit('wrong selected test count')
          run('suite',command+['--','--nocapture'])
          for i in range(12):run('repeat-'+str(i),command+['--','repair_budget_under_load','--exact','--nocapture'])
          run('clippy',['cargo','clippy','-p','cellar','--all-features','--test','native_raft_multigroup','--locked','--','-D','warnings'])
          report['status']='complete'
          (root/'report.json').write_text(json.dumps(report,indent=2))
          PYRUN
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: repair-load-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-evidence/
          retention-days: 7
