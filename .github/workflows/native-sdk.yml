name: CG17 pinned KV and binding admission checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d9e87cd158e9b9c54ebd6a1e0778b9e765268570
          persist-credentials: false
      - name: Install the pinned toolchain and record source
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          mkdir -p "$RUNNER_TEMP/cg17-static"
          git rev-parse HEAD > "$RUNNER_TEMP/cg17-static/source.txt"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/cg17-static-target" >> "$GITHUB_ENV"
      - name: Check both crates and their owning test targets
        run: |
          set -o pipefail
          cargo clippy --locked -p cellar -p cellar-container --all-features --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/cg17-static/clippy.log"
      - name: Check canonical format and layout
        if: always()
        run: |
          cargo format --check
          cargo check-layout
      - name: Preserve source and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cg17-static-d9e87cd15-${{ github.run_id }}
          path: ${{ runner.temp }}/cg17-static
          if-no-files-found: error
          retention-days: 7
