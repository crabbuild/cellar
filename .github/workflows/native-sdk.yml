name: Cellar SDK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification, native-event investigation, Python load or S3 recovery
        type: choice
        default: qualification
        options:
          - qualification
          - consumer-replay
          - clock-replay
          - reliability-replay
          - python-load
          - python-fleet
      load_repetitions:
        description: Optimized Python load repetitions (1-5)
        type: number
        default: 3
      load_read_cells:
        description: Read 1-64 resident cells instead of echo (0 keeps echo)
        type: number
        default: 0
      load_python_read_mode:
        description: Python read path (optimized modes require load_read_cells)
        type: choice
        default: nested
        options: [nested, initial, direct-initial]
      load_cell_echo:
        description: Echo through one resident cell (requires load_read_cells=0)
        type: boolean
        default: false
      load_body_bytes:
        description: Echo body bytes (0-65536, ignored for cell reads)
        type: number
        default: 4096
      load_baseline_sha:
        description: Optional full commit SHA for a same-runner Python before/after comparison
        type: string
        default: ''
      fleet_measure:
        description: Also compare native/Python S3 reads and writes with disjoint Linux CPU pools
        type: boolean
        default: false
      repetitions:
        description: Fresh fixtures (1-100 consumer, 1-50 clock, 1-20 reliability)
        type: number
        default: 20
      replay_sha:
        description: Optional full repository commit SHA for isolated replay, load or S3 recovery
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cellar-sdk-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'qualification' && format('diagnostic-{0}', github.run_id) || 'qualification' }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.1
  # Process tests publish executable artifacts; DWARF makes those fixtures huge.
  # Keep debug assertions and test behavior while omitting symbol information.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  python_fleet:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'python-fleet'
    uses: ./.github/workflows/python-fleet.yml
    with:
      revision: ${{ inputs.replay_sha }}
      measure: ${{ inputs.fleet_measure }}
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'qualification'
    name: Rust framework and SDK (${{ matrix.python }})
    runs-on: ubuntu-22.04
    # ABI/package qualification plus serial fleet tests and restart examples
    # exceed 90 minutes on shared runners; individual test bounds remain intact.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.14'
            runtime: '3.14.5'
            opposite_runtime: '3.14.5t'
            smoke_flags: ''
          - python: '3.14t'
            runtime: '3.14.5t'
            opposite_runtime: '3.14.5'
            smoke_flags: '--expect-free-threaded'
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Select embedded Python
        run: echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Check native-only libraries without Python
        run: PYO3_PYTHON=/nonexistent/cellar-native-only cargo check -p cellar -p cellar-python --no-default-features --lib --locked
      - name: Check Rust formatting
        run: cargo format --check
      - name: Check Rust module layout
        run: cargo check-layout
      - name: Verify native-only dependency graphs have no JavaScript engine
        run: python3 tools/check_native_dependencies.py
      - name: Test native dependency guard against Cargo feature resolution
        run: python3 tools/test_native_dependencies.py
      - name: Verify documentation integrity
        run: python3 tools/docs/check.py
      - name: Test performance workload and evidence guards
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py'
      - name: Test native Python prerequisite capture
        run: python3 tools/python/test_native_prerequisites.py
      - name: Test Python qualification guards
        run: |
          python3 tools/python/test_qualification_guards.py
          python3 tools/python/test_baseline.py
          python3 tools/python/test_runner.py
          python3 tools/python/test_encoding.py
          python3 tools/python/test_affinity.py
          python3 tools/python/test_build_identity.py
          python3 tools/python/test_fleet_smoke.py
          python3 tools/rpc/test_python_cancellation.py
          python3 tools/rpc/test_python_failure.py
      - name: Test Cloudflare benchmark peer relay
        run: |
          npm ci --ignore-scripts --prefix tools/perf/cloudflare
          npm test --prefix tools/perf/cloudflare
      - name: Test embedded Python adapter
        run: |
          python -m venv .cellar/rpc/python
          .cellar/rpc/python/bin/python -m pip install protobuf==7.34.2
          export CELLAR_RPC_PYTHON_SITE="$(.cellar/rpc/python/bin/python -c 'import site; print(site.getsitepackages()[0])')"
          .cellar/rpc/python/bin/python -B tools/rpc/test_python_rpc.py
          cargo test -p cellar-python --features embed --locked -- --test-threads=1
      - name: Verify native and Python baseline harness
        run: |
          cargo build -p cellar-python --example python-offered-load --no-default-features --locked
          python tools/python/test_offered.py target/debug/examples/python-offered-load
          cargo build -p cellar-python --example python-baseline --no-default-features --locked
          cp target/debug/examples/python-baseline "$RUNNER_TEMP/baseline-native"
          cargo build -p cellar-python --example python-baseline --features embed --locked
          cp target/debug/examples/python-baseline "$RUNNER_TEMP/baseline-python"
          python tools/python/baseline.py --native-host "$RUNNER_TEMP/baseline-native" \
            --python-host "selected=$RUNNER_TEMP/baseline-python" \
            --output "$RUNNER_TEMP/python-baseline" --build-profile dev --count 3 --warmup 1 --concurrency 2 --repetitions 1
          python tools/python/baseline_report.py "$RUNNER_TEMP/python-baseline/baseline.json" > "$RUNNER_TEMP/python-baseline/report.md"
          python tools/python/operating_defaults.py --python-host "selected=$RUNNER_TEMP/baseline-python" \
            --output "$RUNNER_TEMP/python-defaults" --build-profile dev --count 4 --concurrency 1 4 16 32 --repetitions 1
          python tools/python/operating_defaults_report.py "$RUNNER_TEMP/python-defaults/operating-defaults.json" > "$RUNNER_TEMP/python-defaults/report.md"
          python tools/python/test_operating_defaults_report.py "$RUNNER_TEMP/python-defaults/operating-defaults.json"
          python tools/python/churn.py --native-host "$RUNNER_TEMP/baseline-native" \
            --python-host "selected=$RUNNER_TEMP/baseline-python" \
            --output "$RUNNER_TEMP/python-churn" --build-profile dev \
            --population 128 --rounds 2 --concurrency 4 --repetitions 1
          python tools/python/churn_report.py "$RUNNER_TEMP/python-churn/churn.json" > "$RUNNER_TEMP/python-churn/report.md"
          python tools/python/test_churn.py --evidence "$RUNNER_TEMP/python-churn/churn.json"
          python tools/python/residency.py --native-host "$RUNNER_TEMP/baseline-native" \
            --python-host "selected=$RUNNER_TEMP/baseline-python" \
            --output "$RUNNER_TEMP/python-residency" --build-profile dev \
            --populations 0 4 --count 3 --warmup 1 --concurrency 2 --repetitions 1
          python tools/python/offered.py --client target/debug/examples/python-offered-load \
            --native-host "$RUNNER_TEMP/baseline-native" --python-host "selected=$RUNNER_TEMP/baseline-python" \
            --output "$RUNNER_TEMP/python-offered" --build-profile dev \
            --rates 20 --duration-ms 1000 --warmup-ms 250 --max-inflight 8 --max-lag-ms 500 --repetitions 1
          python - "$RUNNER_TEMP/python-offered/offered.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              report = json.load(source)
          assert report["status"] == "complete"
          for case in report["cases"]:
              for phase in case["phases"]:
                  outcomes = phase["measurement"]["outcomes"]
                  assert outcomes.get("success", 0) > 0, outcomes
                  assert not set(outcomes) - {"success", "client_late", "client_capacity"}, outcomes
          PY
      - name: Retain baseline failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-failure-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/python-baseline/baseline.json
            ${{ runner.temp }}/python-baseline/**/*.log
            ${{ runner.temp }}/python-defaults/operating-defaults.json
            ${{ runner.temp }}/python-defaults/**/*.log
      - name: Qualify actual loaded Python threading ABI
        run: |
          python -m pip install uv==0.11.19
          export CELLAR_ABI_PREFIX="$(mktemp -d "$RUNNER_TEMP/cellar-abi-runtime-XXXXXX")"
          uv python install '${{ matrix.opposite_runtime }}' --install-dir "$CELLAR_ABI_PREFIX" --no-bin
          export CELLAR_OPPOSITE_PYTHON="$(UV_PYTHON_INSTALL_DIR="$CELLAR_ABI_PREFIX" uv python find --managed-python '${{ matrix.opposite_runtime }}')"
          python -O tools/python/qualify_loaded_abi.py --host "$RUNNER_TEMP/baseline-python" \
            --compiled-python "$PYO3_PYTHON" --opposite-python "$CELLAR_OPPOSITE_PYTHON" \
            --output "$RUNNER_TEMP/python-loaded-abi"
      - name: Exercise embedded Python package
        run: |
          export CELLAR_PYTHON_PREFIX="$(mktemp -d "$RUNNER_TEMP/cellar-python-XXXXXX")"
          uv python install '${{ matrix.runtime }}' --install-dir "$CELLAR_PYTHON_PREFIX/runtime" --no-bin
          export PYO3_PYTHON="$(UV_PYTHON_INSTALL_DIR="$CELLAR_PYTHON_PREFIX/runtime" uv python find --managed-python '${{ matrix.runtime }}')"
          export PYTHONDONTWRITEBYTECODE=1
          "$PYO3_PYTHON" -I -B -m pip download --require-hashes --only-binary :all: \
            -r examples/python/requirements.lock --dest "$CELLAR_PYTHON_PREFIX/wheels"
          "$PYO3_PYTHON" -I -B -m pip install --no-index --find-links "$CELLAR_PYTHON_PREFIX/wheels" \
            --require-hashes --only-binary :all: --target "$CELLAR_PYTHON_PREFIX/site" \
            -r examples/python/requirements.lock
          unset CELLAR_PYTHON_INVENTORY
          cargo build -p cellar-python --bin cellar-python-example --features embed --locked
          export CELLAR_PYTHON_INVENTORY="$CELLAR_PYTHON_PREFIX/inventory.json"
          python tools/python/environment.py capture --python "$PYO3_PYTHON" \
            --site-packages "$CELLAR_PYTHON_PREFIX/site" --native-host target/debug/cellar-python-example --source examples/python/app.py \
            --filename app.py --descriptor examples/python/descriptor.json \
            --target x86_64-unknown-linux-gnu --output "$CELLAR_PYTHON_INVENTORY"
          python tools/python/environment.py bundle "$CELLAR_PYTHON_INVENTORY" \
            --prefix "$CELLAR_PYTHON_PREFIX" --output "$CELLAR_PYTHON_PREFIX/environment.tar.gz"
          python tools/python/environment.py project examples/python/project.json \
            --inventory "$CELLAR_PYTHON_INVENTORY" --archive "$CELLAR_PYTHON_PREFIX/environment.tar.gz" \
            --output "$CELLAR_PYTHON_PREFIX/project.json"
          cargo build -p cellar --bin cellar --example python-package-qualification --locked
          python examples/python/smoke.py --cellar target/debug/cellar \
            --project "$CELLAR_PYTHON_PREFIX/project.json" --with-cron ${{ matrix.smoke_flags }}
          target/debug/cellar build "$CELLAR_PYTHON_PREFIX/project.json" --output "$RUNNER_TEMP/python-package"
          python tools/python/qualify_inventory.py --host target/debug/cellar-python-example \
            --inventory "$CELLAR_PYTHON_INVENTORY" --scratch-prefix "$CELLAR_PYTHON_PREFIX"
          python tools/python/qualify_prerequisites.py --inventory "$CELLAR_PYTHON_INVENTORY" \
            --native-host target/debug/cellar-python-example --target-dir target \
            --output "$RUNNER_TEMP/python-prerequisite-qualification"
          python tools/python/rolling_project.py "$CELLAR_PYTHON_PREFIX/project.json" \
            --native-host target/debug/cellar-python-example \
            --output "$RUNNER_TEMP/python-rolling-project"
          target/debug/cellar build "$RUNNER_TEMP/python-rolling-project/project.json" \
            --output "$RUNNER_TEMP/python-package-v2"
          cargo run -p cellar --example python-package-qualification --locked -- \
            "$RUNNER_TEMP/python-package" "$RUNNER_TEMP" "$RUNNER_TEMP/python-package-v2" \
            --supervisor "$PWD/target/debug/cellar"
      - name: Test and lint
        env:
          # Failed native fixtures retain synthetic recovery observations here.
          TMPDIR: ${{ runner.temp }}/native-failure-fixtures
        run: |
          mkdir -p "$TMPDIR"
          # Fleet fixtures own concurrent runtimes and short authority leases.
          # Run independent cases serially to keep their resource envelope stable.
          # The opt-in RPC qualifier owns every guest runtime, including V8.
          # Keep this native/Python job independent of JavaScript engines.
          cargo test --workspace --exclude cellar-python --exclude cellar-javascript --exclude cellar-rpc-qualification --all-features --lib --tests --locked -- --test-threads=1
          cargo test -p cellar --bin cellar-perf-cells --bin cellar-perf-load --locked -- --test-threads=1
          cargo test --workspace --exclude cellar-javascript --exclude cellar-rpc-qualification --all-features --doc --locked
          cargo clippy --workspace --exclude cellar-javascript --exclude cellar-rpc-qualification --all-targets --all-features --locked -- -D warnings
      - name: Test Axum feature modes and generated contract
        run: |
          cargo test -p cellar-axum --no-default-features --locked
          cargo check -p cellar-axum-counter --no-default-features --bins --locked
          cargo run -p cellar-axum-counter --bin export-openapi --locked -- "$RUNNER_TEMP/counter-openapi.json"
          diff examples/axum-counter/openapi.json "$RUNNER_TEMP/counter-openapi.json"
          python3 examples/axum-counter/generate_client.py "$RUNNER_TEMP/counter-openapi.json" "$RUNNER_TEMP/counter-client.rs"
          rustfmt --edition 2021 "$RUNNER_TEMP/counter-client.rs"
          diff examples/axum-counter/generated_client.rs "$RUNNER_TEMP/counter-client.rs"
      - name: Build a Rust application package
        run: |
          cargo run -p cellar --bin cellar --locked -- \
            build examples/native-counter/project.json \
            --output "$RUNNER_TEMP/native-counter-package"
      - name: Exercise native Rust examples
        run: |
          cargo build -p cellar --bin cellar --bin cellar-native-examples \
            --bin cellar-example-embedded --locked
          python3 examples/focused_smoke.py --cellar target/debug/cellar --with-cron
          python3 examples/smoke.py --cellar target/debug/cellar
          python3 examples/smoke.py --cellar target/debug/cellar \
            --project examples/team-services/project.json --suite team
          python3 examples/platform_smoke.py --cellar target/debug/cellar \
            --embedded target/debug/cellar-example-embedded --with-containers

      - name: Preserve native failure observations
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-failure-observations-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Only structured observations from this job's private test directory;
          # do not upload arbitrary /tmp contents or fixture databases/binaries.
          path: |
            ${{ runner.temp }}/native-failure-fixtures/**/failure.json
            ${{ runner.temp }}/native-failure-fixtures/**/cold-read-failure.json
            ${{ runner.temp }}/native-failure-fixtures/**/cold-start-failure.json
            ${{ runner.temp }}/native-failure-fixtures/**/cold-adopt-failure.json
            ${{ runner.temp }}/native-failure-fixtures/**/initial-settlement-failure.json
            ${{ runner.temp }}/native-failure-fixtures/**/settlement-failure.json
            ${{ runner.temp }}/native-failure-fixtures/**/delayed-cold-read.json
            ${{ runner.temp }}/native-failure-fixtures/**/accepted-prefix.json
            ${{ runner.temp }}/native-failure-fixtures/**/post-recovery-fetch.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-churn-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-churn/**/*.json
            ${{ runner.temp }}/python-churn/**/*.log
            ${{ runner.temp }}/python-churn/report.md
          if-no-files-found: ignore
          retention-days: 7

  python_load:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'python-load'
    name: Optimized Python load (${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14.5', '3.14.5t']
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_LAB_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CELLAR_LOAD_REPETITIONS: ${{ inputs.load_repetitions }}
      CELLAR_LOAD_READ_CELLS: ${{ inputs.load_read_cells }}
      CELLAR_LOAD_PYTHON_READ_MODE: ${{ inputs.load_python_read_mode }}
      CELLAR_LOAD_CELL_ECHO: ${{ inputs.load_cell_echo }}
      CELLAR_LOAD_BODY_BYTES: ${{ inputs.load_body_bytes }}
      CELLAR_LOAD_SHA: ${{ inputs.replay_sha }}
      CELLAR_LOAD_PYTHON: ${{ matrix.python }}
      CELLAR_LOAD_BASELINE_SHA: ${{ inputs.load_baseline_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.replay_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate bounded workload and source
        run: |
          python tools/python/test_affinity.py
          python tools/python/test_build_identity.py
          python - <<'PY'
          import os, re, subprocess
          repetitions = int(os.environ['CELLAR_LOAD_REPETITIONS'])
          if not 1 <= repetitions <= 5:
              raise SystemExit('load_repetitions must be from 1 to 5')
          if not 0 <= int(os.environ['CELLAR_LOAD_READ_CELLS']) <= 64:
              raise SystemExit('load_read_cells must be from 0 to 64')
          read_mode = os.environ['CELLAR_LOAD_PYTHON_READ_MODE']
          if read_mode not in ('nested', 'initial', 'direct-initial'):
              raise SystemExit('invalid Python read mode')
          if read_mode != 'nested' and not int(os.environ['CELLAR_LOAD_READ_CELLS']):
              raise SystemExit('optimized Python read modes require load_read_cells')
          if os.environ['CELLAR_LOAD_CELL_ECHO'] not in ('true', 'false'):
              raise SystemExit('load_cell_echo must be a boolean')
          if os.environ['CELLAR_LOAD_CELL_ECHO'] == 'true' and int(os.environ['CELLAR_LOAD_READ_CELLS']):
              raise SystemExit('cell echo and cell reads are distinct workloads')
          if not 0 <= int(os.environ['CELLAR_LOAD_BODY_BYTES']) <= 65536:
              raise SystemExit('load_body_bytes must be from 0 to 65536')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ.get('CELLAR_LOAD_SHA', '').lower()
          if expected and actual != expected:
              raise SystemExit('Load checkout differs from requested SHA')
          print(f'Optimized load source {actual}', flush=True)
          baseline = os.environ['CELLAR_LOAD_BASELINE_SHA']
          if baseline and not re.fullmatch('[0-9a-f]{40}', baseline):
              raise SystemExit('load_baseline_sha must be a full lowercase commit SHA')
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise SystemExit('Offered load requires disjoint host/client CPU sets')
          width = len(cpus) // 2
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('CELLAR_LOAD_HOST_CPUS=' + ','.join(map(str, cpus[:width])) + '\n')
              environment.write('CELLAR_LOAD_CLIENT_CPUS=' + ','.join(map(str, cpus[width:2*width])) + '\n')
          PY
      - uses: actions/checkout@v6
        if: inputs.load_baseline_sha != ''
        with:
          ref: ${{ inputs.load_baseline_sha }}
          path: .python-load-reference
          persist-credentials: false
      - name: Build fixed optimized native and Python artifacts
        id: build_hosts
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          export PYO3_PYTHON="$(command -v python)"
          cargo build -p cellar-python --example python-offered-load --example python-baseline --no-default-features --profile lab --locked
          cp target/lab/examples/python-baseline "$RUNNER_TEMP/load-native"
          cargo build -p cellar-python --example python-baseline --features embed --profile lab --locked
          cp target/lab/examples/python-baseline "$RUNNER_TEMP/load-python"
          if test -n "$CELLAR_LOAD_BASELINE_SHA"; then
            test "$(git -C .python-load-reference rev-parse HEAD)" = "$CELLAR_LOAD_BASELINE_SHA"
            # A workload change must not masquerade as an adapter speedup.
            for fixture in baseline.rs baseline_host.rs baseline_native.rs baseline_app.py; do
              cmp "tools/python/$fixture" ".python-load-reference/tools/python/$fixture"
            done
            python - <<'PY'
          import tomllib
          from pathlib import Path
          selected = tomllib.loads(Path('Cargo.toml').read_text()).get('profile', {})
          reference = tomllib.loads(Path('.python-load-reference/Cargo.toml').read_text()).get('profile', {})
          if selected != reference:
              raise SystemExit('Reference and selected Cargo build profiles differ')
          PY
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-python-load-reference" cargo build \
              --manifest-path .python-load-reference/Cargo.toml \
              -p cellar-python --example python-baseline --features embed --profile lab --locked
            cp target-python-load-reference/lab/examples/python-baseline "$RUNNER_TEMP/load-python-before"
          fi
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'tools/python')
          from build_identity import inspect_binary, validate_comparison
          root = Path(os.environ['RUNNER_TEMP'])
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          builds = [('native', 'load-native', source), ('selected', 'load-python', source)]
          if os.environ['CELLAR_LOAD_BASELINE_SHA']:
              builds.append(('baseline', 'load-python-before', os.environ['CELLAR_LOAD_BASELINE_SHA']))
          report = dict(profile='lab', rustc=subprocess.check_output(['rustc', '-vV'], text=True),
                        python=sys.version, cargo_profiles=tomllib.loads(Path('Cargo.toml').read_text()).get('profile', {}),
                        profile_debug=os.environ['CARGO_PROFILE_LAB_DEBUG'], executables={label:dict(source=revision,
                        **inspect_binary(root / name, Path('.python-load-reference') if label == 'baseline' else Path('.'),
                                         embedded=label != 'native'))
                        for label, name, revision in builds})
          validate_comparison(report['executables'])
          report['fixtures'] = {name:hashlib.sha256(Path('tools/python', name).read_bytes()).hexdigest()
                                for name in ('baseline.rs', 'baseline_host.rs', 'baseline_native.rs', 'baseline_app.py')}
          (root / 'python-load').mkdir(exist_ok=True)
          (root / 'python-load/builds.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Qualify activation churn and owner-loss recovery
        run: |
          python tools/python/churn.py --native-host "$RUNNER_TEMP/load-native" \
            --python-host "selected=$RUNNER_TEMP/load-python" --output "$RUNNER_TEMP/python-load/churn" \
            --build-profile lab --population 128 --rounds 16 --concurrency 4 --repetitions "$CELLAR_LOAD_REPETITIONS"
          python tools/python/churn_report.py "$RUNNER_TEMP/python-load/churn/churn.json" > "$RUNNER_TEMP/python-load/churn/report.md"
          python tools/python/test_churn.py --evidence "$RUNNER_TEMP/python-load/churn/churn.json"
          python - "$RUNNER_TEMP/python-load/churn/churn.json" <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1]))
          expected_free = os.environ['CELLAR_LOAD_PYTHON'].endswith('t')
          for case in report['cases']:
              runtime = case['python_runtime']
              if runtime is not None and (runtime['free_threaded'] != expected_free or runtime['gil_enabled'] == expected_free):
                  raise SystemExit('Loaded Python ABI/GIL state differs from selected matrix runtime')
          PY
      - name: Measure independent arrivals and retain refusals
        if: ${{ !cancelled() && steps.build_hosts.outcome == 'success' }}
        run: |
          comparison=()
          if test -n "$CELLAR_LOAD_BASELINE_SHA"; then
            comparison=(--python-host "baseline=$RUNNER_TEMP/load-python-before")
          fi
          workload=(--body-bytes "$CELLAR_LOAD_BODY_BYTES")
          if test "$CELLAR_LOAD_READ_CELLS" -gt 0; then
            workload=(--body-bytes 0 --read-cells "$CELLAR_LOAD_READ_CELLS")
          elif test "$CELLAR_LOAD_CELL_ECHO" = true; then
            workload+=(--cell-echo)
          fi
          python tools/python/offered.py --client target/lab/examples/python-offered-load \
            --native-host "$RUNNER_TEMP/load-native" --python-host "selected=$RUNNER_TEMP/load-python" \
            "${comparison[@]}" "${workload[@]}" \
            --python-read-mode "$CELLAR_LOAD_PYTHON_READ_MODE" \
            --output "$RUNNER_TEMP/python-load/offered" --build-profile lab \
            --host-cpus "$CELLAR_LOAD_HOST_CPUS" --client-cpus "$CELLAR_LOAD_CLIENT_CPUS" \
            --rates 500 5000 15000 --duration-ms 5000 --warmup-ms 500 --max-inflight 64 --repetitions "$CELLAR_LOAD_REPETITIONS"
          python - "$RUNNER_TEMP/python-load/offered/offered.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/python')
          from offered import summarize
          report = json.load(open(sys.argv[1]))
          if report['status'] != 'complete':
              raise SystemExit('Incomplete offered-load experiment')
          if report['read_cells'] != int(os.environ['CELLAR_LOAD_READ_CELLS']):
              raise SystemExit('Measured cell population differs from requested workload')
          if report['python_read_mode'] != os.environ['CELLAR_LOAD_PYTHON_READ_MODE']:
              raise SystemExit('Measured Python read path differs from requested workload')
          if report['cell_echo'] != (os.environ['CELLAR_LOAD_CELL_ECHO'] == 'true'):
              raise SystemExit('Measured echo route differs from requested workload')
          expected_body = 0 if report['read_cells'] else int(os.environ['CELLAR_LOAD_BODY_BYTES'])
          expected_route = '/' if report['read_cells'] else ('/cell-echo' if report['cell_echo'] else '/echo')
          builds = json.loads((Path(sys.argv[1]).parent.parent / 'builds.json').read_text())
          for host in report['hosts']:
              if host['sha256'] != builds['executables'][host['label']]['sha256']:
                  raise SystemExit('Measured executable differs from frozen build')
          for case in report['cases']:
              runtime = case['python_runtime']
              free = os.environ['CELLAR_LOAD_PYTHON'].endswith('t')
              if runtime is not None and (runtime['free_threaded'] != free or runtime['gil_enabled'] == free):
                  raise SystemExit('Measured Python ABI/GIL state differs from selected runtime')
              root = Path(sys.argv[1]).parent / f"{case['runtime']}-{case['repetition']}"
              for phase in case['phases']:
                  for name in ('warmup', 'measurement'):
                      prefix = 'warmup' if name == 'warmup' else 'measured'
                      raw = json.loads((root / f"{prefix}-{phase['rate']}.json").read_text())
                      if raw['workload']['body_bytes'] != expected_body or raw['workload']['url'] != case['host']['url'].rstrip('/') + expected_route:
                          raise SystemExit('Raw workload differs from requested body or route')
                      if summarize(raw) != phase[name]:
                          raise SystemExit('Offered-load summary differs from raw arrivals')
                      for row in raw['samples']:
                          if row['outcome'] not in ('success', 'client_late', 'client_capacity', 'http_status') or (row['outcome'] == 'http_status' and row['status'] != 503):
                              raise SystemExit(f'Unexpected application/transport failure: {row}')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-load-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-load/**/*.json
            ${{ runner.temp }}/python-load/**/*.log
            ${{ runner.temp }}/python-load/**/*.md
          if-no-files-found: ignore
          retention-days: 7

  native_replay:
    name: Native event replay (${{ inputs.mode }}, diagnostic only)
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'consumer-replay' || inputs.mode == 'clock-replay' || inputs.mode == 'reliability-replay')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Validate replay source
        env:
          CELLAR_NATIVE_REPLAY_SHA: ${{ inputs.replay_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re

          selected = os.environ["CELLAR_NATIVE_REPLAY_SHA"]
          if selected and not re.fullmatch(r"[0-9a-fA-F]{40}", selected):
              raise SystemExit("Replay source must be a full 40-character commit SHA")
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.replay_sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Replay fresh event fixtures
        env:
          CELLAR_NATIVE_REPLAY_MODE: ${{ inputs.mode }}
          CELLAR_NATIVE_REPLAY_SHA: ${{ inputs.replay_sha }}
          CELLAR_NATIVE_REPETITIONS: ${{ inputs.repetitions }}
          CELLAR_NATIVE_REPLAY_ROOT: /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          fixtures = {
              "consumer-replay": (["node_events::event_refusal_clock::live_foreign_recovery_resumes_after_replaced_claimed_metadata_returns"], 100),
              "clock-replay": (["node_events::event_refusal_clock::cold_follower_audit_survives_one_read_deadline_without_receipt_replay"], 50),
              "reliability-replay": ([
                  "lease_renewal::a_late_committed_renewal_keeps_time_for_actual_readback",
                  "management_crons_report_pending_until_embedded_host_adopts",
                  "node_events::event_refusal_clock::root_loss_after_lineage_capture_refuses_boot_until_original_proof_returns",
                  "node_events::event_settlement_race::settlement_race_reset_invalidates_pending_ack_and_extension",
              ], 20),
          }
          mode = os.environ["CELLAR_NATIVE_REPLAY_MODE"]
          if mode not in fixtures:
              raise SystemExit("Unknown native replay mode")
          selected_cases, maximum = fixtures[mode]
          repetitions = int(os.environ["CELLAR_NATIVE_REPETITIONS"])
          if not 1 <= repetitions <= maximum:
              raise SystemExit(f"{mode} repetitions must be an integer from 1 to {maximum}")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ.get("CELLAR_NATIVE_REPLAY_SHA", "").lower()
          if expected and actual != expected:
              raise SystemExit("Native replay checkout differs from requested commit")
          print(f"Native replay source {actual}", flush=True)
          root = Path(os.environ["CELLAR_NATIVE_REPLAY_ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          environment = dict(os.environ, TMPDIR=str(root))
          command = ["cargo", "test", "-p", "cellar", "--all-features", "--test", "native_node", "--locked", "--"]
          for selected in selected_cases:
              listed = subprocess.run(command + [selected, "--exact", "--list"], check=True,
                                      env=environment, stdout=subprocess.PIPE, text=True)
              if listed.stdout.splitlines().count(f"{selected}: test") != 1:
                  raise SystemExit("Native replay fixture did not select exactly one test")
          report = {"format": 1, "source": actual, "mode": mode,
                    "repetitions": repetitions, "fixtures": selected_cases, "status": "running", "runs": []}
          evidence = root / "replay.json"
          evidence.write_text(json.dumps(report, indent=2) + "\n")
          for iteration in range(repetitions):
              for selected in selected_cases:
                  print(f"Fresh {mode} fixture {iteration + 1}/{repetitions}: {selected}", flush=True)
                  started = time.monotonic_ns()
                  result = subprocess.run(command + [selected, "--exact", "--nocapture", "--test-threads=1"],
                                          env=environment)
                  report["runs"].append({"fixture": selected, "iteration": iteration,
                                         "returncode": result.returncode,
                                         "elapsed_ns": time.monotonic_ns() - started})
                  if result.returncode:
                      report["status"] = "failed"
                  evidence.write_text(json.dumps(report, indent=2) + "\n")
                  result.check_returncode()
          report["status"] = "complete"
          evidence.write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-replay-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/replay.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/cold-read-failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/cold-start-failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/cold-adopt-failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/initial-settlement-failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/initial-fetch-failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/settlement-failure.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/delayed-cold-read.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/accepted-prefix.json
            /tmp/cellar-native-replay-${{ github.run_id }}-${{ github.run_attempt }}/**/post-recovery-fetch.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
