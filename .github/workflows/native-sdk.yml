name: Cellar SDK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification, native-event investigation, Python load or S3 recovery
        type: choice
        default: qualification
        options:
          - qualification
          - consumer-replay
          - clock-replay
          - reliability-replay
          - python-load
          - python-fleet
      load_repetitions:
        description: Optimized Python load repetitions (1-5)
        type: number
        default: 3
      load_read_cells:
        description: Read 1-64 resident cells instead of echo (0 keeps echo)
        type: number
        default: 0
      load_python_read_mode:
        description: Python read path (optimized modes require load_read_cells)
        type: choice
        default: nested
        options: [nested, initial, direct-initial]
      load_cell_echo:
        description: Echo through one resident cell (requires load_read_cells=0)
        type: boolean
        default: false
      load_body_bytes:
        description: Echo body bytes (0-65536, ignored for cell reads)
        type: number
        default: 4096
      load_baseline_sha:
        description: Optional full commit SHA for a same-runner Python before/after comparison
        type: string
        default: ''
      fleet_measure:
        description: Also compare native/Python S3 reads and writes with disjoint Linux CPU pools
        type: boolean
        default: false
      repetitions:
        description: Fresh fixtures (1-100 consumer, 1-50 clock, 1-20 reliability)
        type: number
        default: 20
      replay_sha:
        description: Optional full repository commit SHA for isolated replay, load or S3 recovery
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cellar-sdk-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'qualification' && format('diagnostic-{0}', github.run_id) || 'qualification' }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.1
  # Process tests publish executable artifacts; DWARF makes those fixtures huge.
  # Keep debug assertions and test behavior while omitting symbol information.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  python_load:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'python-load'
    name: Optimized Python load (${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14.5', '3.14.5t']
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_LAB_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CELLAR_LOAD_REPETITIONS: ${{ inputs.load_repetitions }}
      CELLAR_LOAD_READ_CELLS: ${{ inputs.load_read_cells }}
      CELLAR_LOAD_PYTHON_READ_MODE: ${{ inputs.load_python_read_mode }}
      CELLAR_LOAD_CELL_ECHO: ${{ inputs.load_cell_echo }}
      CELLAR_LOAD_BODY_BYTES: ${{ inputs.load_body_bytes }}
      CELLAR_LOAD_SHA: ${{ inputs.replay_sha }}
      CELLAR_LOAD_PYTHON: ${{ matrix.python }}
      CELLAR_LOAD_BASELINE_SHA: ${{ inputs.load_baseline_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.replay_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate bounded workload and source
        run: |
          python tools/python/test_affinity.py
          python tools/python/test_build_identity.py
          python - <<'PY'
          import os, re, subprocess
          repetitions = int(os.environ['CELLAR_LOAD_REPETITIONS'])
          if not 1 <= repetitions <= 5:
              raise SystemExit('load_repetitions must be from 1 to 5')
          if not 0 <= int(os.environ['CELLAR_LOAD_READ_CELLS']) <= 64:
              raise SystemExit('load_read_cells must be from 0 to 64')
          read_mode = os.environ['CELLAR_LOAD_PYTHON_READ_MODE']
          if read_mode not in ('nested', 'initial', 'direct-initial'):
              raise SystemExit('invalid Python read mode')
          if read_mode != 'nested' and not int(os.environ['CELLAR_LOAD_READ_CELLS']):
              raise SystemExit('optimized Python read modes require load_read_cells')
          if os.environ['CELLAR_LOAD_CELL_ECHO'] not in ('true', 'false'):
              raise SystemExit('load_cell_echo must be a boolean')
          if os.environ['CELLAR_LOAD_CELL_ECHO'] == 'true' and int(os.environ['CELLAR_LOAD_READ_CELLS']):
              raise SystemExit('cell echo and cell reads are distinct workloads')
          if not 0 <= int(os.environ['CELLAR_LOAD_BODY_BYTES']) <= 65536:
              raise SystemExit('load_body_bytes must be from 0 to 65536')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ.get('CELLAR_LOAD_SHA', '').lower()
          if expected and actual != expected:
              raise SystemExit('Load checkout differs from requested SHA')
          print(f'Optimized load source {actual}', flush=True)
          baseline = os.environ['CELLAR_LOAD_BASELINE_SHA']
          if baseline and not re.fullmatch('[0-9a-f]{40}', baseline):
              raise SystemExit('load_baseline_sha must be a full lowercase commit SHA')
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise SystemExit('Offered load requires disjoint host/client CPU sets')
          width = len(cpus) // 2
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('CELLAR_LOAD_HOST_CPUS=' + ','.join(map(str, cpus[:width])) + '\n')
              environment.write('CELLAR_LOAD_CLIENT_CPUS=' + ','.join(map(str, cpus[width:2*width])) + '\n')
          PY
      - uses: actions/checkout@v6
        if: inputs.load_baseline_sha != ''
        with:
          ref: ${{ inputs.load_baseline_sha }}
          path: .python-load-reference
          persist-credentials: false
      - name: Build fixed optimized native and Python artifacts
        id: build_hosts
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          export PYO3_PYTHON="$(command -v python)"
          cargo build -p cellar-python --example python-offered-load --example python-baseline --no-default-features --profile lab --locked
          cp target/lab/examples/python-baseline "$RUNNER_TEMP/load-native"
          cargo build -p cellar-python --example python-baseline --features embed --profile lab --locked
          cp target/lab/examples/python-baseline "$RUNNER_TEMP/load-python"
          if test -n "$CELLAR_LOAD_BASELINE_SHA"; then
            test "$(git -C .python-load-reference rev-parse HEAD)" = "$CELLAR_LOAD_BASELINE_SHA"
            # A workload change must not masquerade as an adapter speedup.
            for fixture in baseline.rs baseline_host.rs baseline_native.rs baseline_app.py; do
              cmp "tools/python/$fixture" ".python-load-reference/tools/python/$fixture"
            done
            python - <<'PY'
          import tomllib
          from pathlib import Path
          selected = tomllib.loads(Path('Cargo.toml').read_text()).get('profile', {})
          reference = tomllib.loads(Path('.python-load-reference/Cargo.toml').read_text()).get('profile', {})
          if selected != reference:
              raise SystemExit('Reference and selected Cargo build profiles differ')
          PY
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-python-load-reference" cargo build \
              --manifest-path .python-load-reference/Cargo.toml \
              -p cellar-python --example python-baseline --features embed --profile lab --locked
            cp target-python-load-reference/lab/examples/python-baseline "$RUNNER_TEMP/load-python-before"
          fi
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'tools/python')
          from build_identity import inspect_binary, validate_comparison
          root = Path(os.environ['RUNNER_TEMP'])
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          builds = [('native', 'load-native', source), ('selected', 'load-python', source)]
          if os.environ['CELLAR_LOAD_BASELINE_SHA']:
              builds.append(('baseline', 'load-python-before', os.environ['CELLAR_LOAD_BASELINE_SHA']))
          report = dict(profile='lab', rustc=subprocess.check_output(['rustc', '-vV'], text=True),
                        python=sys.version, cargo_profiles=tomllib.loads(Path('Cargo.toml').read_text()).get('profile', {}),
                        profile_debug=os.environ['CARGO_PROFILE_LAB_DEBUG'], executables={label:dict(source=revision,
                        **inspect_binary(root / name, Path('.python-load-reference') if label == 'baseline' else Path('.'),
                                         embedded=label != 'native'))
                        for label, name, revision in builds})
          validate_comparison(report['executables'])
          report['fixtures'] = {name:hashlib.sha256(Path('tools/python', name).read_bytes()).hexdigest()
                                for name in ('baseline.rs', 'baseline_host.rs', 'baseline_native.rs', 'baseline_app.py')}
          (root / 'python-load').mkdir(exist_ok=True)
          (root / 'python-load/builds.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Measure independent arrivals and retain refusals
        if: ${{ !cancelled() && steps.build_hosts.outcome == 'success' }}
        run: |
          comparison=()
          if test -n "$CELLAR_LOAD_BASELINE_SHA"; then
            comparison=(--python-host "baseline=$RUNNER_TEMP/load-python-before")
          fi
          workload=(--body-bytes "$CELLAR_LOAD_BODY_BYTES")
          if test "$CELLAR_LOAD_READ_CELLS" -gt 0; then
            workload=(--body-bytes 0 --read-cells "$CELLAR_LOAD_READ_CELLS")
          elif test "$CELLAR_LOAD_CELL_ECHO" = true; then
            workload+=(--cell-echo)
          fi
          python tools/python/offered.py --client target/lab/examples/python-offered-load \
            --native-host "$RUNNER_TEMP/load-native" --python-host "selected=$RUNNER_TEMP/load-python" \
            "${comparison[@]}" "${workload[@]}" \
            --python-read-mode "$CELLAR_LOAD_PYTHON_READ_MODE" \
            --output "$RUNNER_TEMP/python-load/offered" --build-profile lab \
            --host-cpus "$CELLAR_LOAD_HOST_CPUS" --client-cpus "$CELLAR_LOAD_CLIENT_CPUS" \
            --rates 500 15000 50000 --duration-ms 5000 --warmup-ms 500 --max-inflight 64 --repetitions "$CELLAR_LOAD_REPETITIONS"
          python - "$RUNNER_TEMP/python-load/offered/offered.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/python')
          from offered import summarize
          report = json.load(open(sys.argv[1]))
          if report['status'] != 'complete':
              raise SystemExit('Incomplete offered-load experiment')
          if report['read_cells'] != int(os.environ['CELLAR_LOAD_READ_CELLS']):
              raise SystemExit('Measured cell population differs from requested workload')
          if report['python_read_mode'] != os.environ['CELLAR_LOAD_PYTHON_READ_MODE']:
              raise SystemExit('Measured Python read path differs from requested workload')
          if report['cell_echo'] != (os.environ['CELLAR_LOAD_CELL_ECHO'] == 'true'):
              raise SystemExit('Measured echo route differs from requested workload')
          expected_body = 0 if report['read_cells'] else int(os.environ['CELLAR_LOAD_BODY_BYTES'])
          expected_route = '/' if report['read_cells'] else ('/cell-echo' if report['cell_echo'] else '/echo')
          builds = json.loads((Path(sys.argv[1]).parent.parent / 'builds.json').read_text())
          for host in report['hosts']:
              if host['sha256'] != builds['executables'][host['label']]['sha256']:
                  raise SystemExit('Measured executable differs from frozen build')
          for case in report['cases']:
              runtime = case['python_runtime']
              free = os.environ['CELLAR_LOAD_PYTHON'].endswith('t')
              if runtime is not None and (runtime['free_threaded'] != free or runtime['gil_enabled'] == free):
                  raise SystemExit('Measured Python ABI/GIL state differs from selected runtime')
              root = Path(sys.argv[1]).parent / f"{case['runtime']}-{case['repetition']}"
              for phase in case['phases']:
                  for name in ('warmup', 'measurement'):
                      prefix = 'warmup' if name == 'warmup' else 'measured'
                      raw = json.loads((root / f"{prefix}-{phase['rate']}.json").read_text())
                      if raw['workload']['body_bytes'] != expected_body or raw['workload']['url'] != case['host']['url'].rstrip('/') + expected_route:
                          raise SystemExit('Raw workload differs from requested body or route')
                      if summarize(raw) != phase[name]:
                          raise SystemExit('Offered-load summary differs from raw arrivals')
                      for row in raw['samples']:
                          if row['outcome'] not in ('success', 'client_late', 'client_capacity', 'http_status') or (row['outcome'] == 'http_status' and row['status'] != 503):
                              raise SystemExit(f'Unexpected application/transport failure: {row}')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-load-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-load/**/*.json
            ${{ runner.temp }}/python-load/**/*.log
            ${{ runner.temp }}/python-load/**/*.md
          if-no-files-found: ignore
          retention-days: 7

