name: JavaScript and Node SDK
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/cellar-sdk/**'
      - 'packages/cellar-cloudflare/**'
      - 'examples/javascript/**'
      - 'examples/node/**'
      - 'examples/streaming/**'
      - 'examples/bindings/**'
      - 'examples/pi-agent/**'
      - 'examples/vercel-agent/**'
      - 'examples/filesystem-agent/**'
      - 'tools/javascript/**'
      - 'tools/sandbox/**'
      - 'tools/rpc/**'
      - 'tools/cellar-rpc-codegen/**'
      - 'proto/**'
      - 'plans/named-typed-rpc/*.proto'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/javascript-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.1
      - name: Locked npm build
        run: |
          npm ci --prefix tools/javascript --ignore-scripts
          npm run --prefix tools/javascript format:check
          npm ci --prefix examples/javascript --ignore-scripts
          npm ci --prefix examples/node --ignore-scripts
          npm ci --prefix examples/streaming --ignore-scripts
          npm ci --prefix examples/bindings --ignore-scripts
          npm ci --prefix examples/pi-agent --ignore-scripts
          npm ci --prefix examples/vercel-agent --ignore-scripts
          npm ci --prefix examples/filesystem-agent --ignore-scripts
          npm ci --prefix tools/rpc --ignore-scripts
          npm ci --prefix examples/vercel-agent/ui --ignore-scripts
          npm run --prefix examples/node build
          npm run --prefix examples/streaming build
          npm run --prefix examples/bindings build
          npm run --prefix examples/pi-agent build
          npm test --prefix examples/pi-agent
          npm run --prefix examples/vercel-agent build
          npm run --prefix examples/vercel-agent/ui build
          npm test --prefix examples/vercel-agent
          npm run --prefix examples/vercel-agent format:check
          node --test packages/cellar-sdk/test/streaming.test.mjs
          node tools/javascript/node_modules/typescript/bin/tsc --noEmit --strict --target es2022 --module nodenext packages/cellar-sdk/test/types.ts packages/cellar-sdk/test/filesystem-types.ts
          npm test --prefix tools/javascript
          npm run --prefix examples/javascript build
          npm test --prefix tools/rpc
          npm run --prefix tools/rpc typecheck
          npm run --prefix tools/rpc build
      - name: Published sandbox compatibility input identities
        run: |
          node tools/sandbox/e2b/check.mjs
          node --test tools/sandbox/e2b/check.test.mjs
          node tools/sandbox/vercel/check.mjs
          node --test tools/sandbox/vercel/check.test.mjs
          python3 tools/sandbox/vercel/helper_test.py
          npm ci --ignore-scripts --prefix tools/sandbox/compat
          npm run inventory --prefix tools/sandbox/compat
          npm test --prefix tools/sandbox/compat
          node tools/sandbox/compat/build.mjs
      - name: Chat UI desktop and mobile behavior
        run: |
          npm exec --prefix examples/vercel-agent/ui -- playwright install --with-deps chromium
          npm run --prefix examples/vercel-agent/ui test:ui
      - name: Adapter and real-node tests
        run: cargo test --locked -p cellar-container -p cellar-guest -p cellar-javascript --features cellar-javascript/embed,cellar-javascript/node
      - name: Node-only feature
        run: cargo test --locked -p cellar-javascript --no-default-features --features node
      - name: Runtime archive and admission boundaries
        run: |
          cargo test --locked -p cellar --lib node_environment
          cargo test --locked -p cellar --lib runtime_inventory
          cargo test --locked -p cellar --lib python_environment::archive
          cargo test --locked -p cellar --lib runtime_directories
          cargo test --locked -p cellar --test native_artifacts
      - name: Pi agent crash recovery
        run: |
          cargo build --locked -p cellar-javascript --no-default-features --features node --bin cellar-pi-agent-example
          CELLAR_PI_HOST="${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar-pi-agent-example" npm run --prefix examples/pi-agent test:e2e
      - name: Vercel AI SDK agent crash recovery and concurrent tasks
        run: |
          cargo build --locked -p cellar-javascript --no-default-features --features node --bin cellar-vercel-agent-example
          CELLAR_AI_HOST="${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar-vercel-agent-example" npm run --prefix examples/vercel-agent test:e2e
          CELLAR_AI_HOST="${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar-vercel-agent-example" npm run --prefix examples/vercel-agent test:tools
      - name: Filesystem agent atomic tools and cold recovery
        run: |
          cargo build --locked -p cellar-javascript --no-default-features --features node --bin cellar-filesystem-agent-example
          CELLAR_FS_HOST="${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar-filesystem-agent-example" npm run --prefix examples/filesystem-agent test:e2e
      - name: Vercel agent cold recovery from RustFS
        shell: bash
        run: |
          aws --version
          store="cellar-ai-rustfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          private="$RUNNER_TEMP/cellar-ai-rustfs.env"
          python3 - "$private" <<'PY'
          import os, secrets, sys
          with open(sys.argv[1], 'x', opener=lambda path, flags: os.open(path, flags, 0o600)) as output:
              output.write('AWS_ACCESS_KEY_ID=' + secrets.token_hex(16) + '\n')
              output.write('AWS_SECRET_ACCESS_KEY=' + secrets.token_hex(32) + '\n')
          PY
          set -a
          source "$private"
          set +a
          trap 'docker rm -f "$store" >/dev/null 2>&1 || true; rm -f "$private"' EXIT
          docker run --detach --name "$store" --publish 127.0.0.1::9000 --cpus 2 --memory 2g \
            --env "RUSTFS_ACCESS_KEY=$AWS_ACCESS_KEY_ID" \
            --env "RUSTFS_SECRET_KEY=$AWS_SECRET_ACCESS_KEY" \
            --env RUSTFS_CONSOLE_ENABLE=false \
            ghcr.io/rustfs/rustfs@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858 /data
          export S3_ENDPOINT="http://$(docker port "$store" 9000/tcp)"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$S3_ENDPOINT/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$S3_ENDPOINT/health" >/dev/null
          export CELLAR_AI_STORE=s3 AWS_REGION=us-east-1
          export CELLAR_AI_HOST="${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar-vercel-agent-example"
          export CELLAR_AI_TEST_REPORT="$RUNNER_TEMP/vercel-rustfs-recovery.json"
          npm run --prefix examples/vercel-agent test:e2e
          export CELLAR_AI_TEST_REPORT="$RUNNER_TEMP/vercel-rustfs-tools.json"
          npm run --prefix examples/vercel-agent test:tools
      - name: RustFS recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-rustfs-recovery
          path: |
            ${{ runner.temp }}/vercel-rustfs-recovery.json
            ${{ runner.temp }}/vercel-rustfs-tools.json
          if-no-files-found: ignore
      - name: Quality and engine boundaries
        run: |
          cargo clippy --locked -p cellar-container -p cellar-guest -p cellar-javascript --features cellar-javascript/embed,cellar-javascript/node --all-targets -- -D warnings
          cargo format --check
          cargo check-layout
          python3 tools/check_native_dependencies.py
          python3 tools/docs/check.py
      - name: Native package
        run: cargo run --locked -p cellar -- build examples/javascript/project.json --output .cellar/javascript-package
      - name: Runnable streaming examples and restart
        run: |
          python3 examples/streaming/smoke.py --cellar "${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar" \
            --backend rust --backend node-js --backend node-ts --backend v8
      - name: Runnable binding examples, restart and rebinding
        run: |
          python3 examples/bindings/smoke.py --cellar "${CARGO_TARGET_DIR:-$PWD/target}/debug/cellar" \
            --backend rust --backend node-js --backend node-ts --backend v8
      - name: Node runtime delivery
        run: |
          cargo build --locked -p cellar-javascript --no-default-features --features node --bin cellar-node-example
          mkdir -p .cellar
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {resolve} from 'node:path';
          writeFileSync('.cellar/node-delivery.json',JSON.stringify({host:resolve(process.env.CARGO_TARGET_DIR ?? 'target','debug/cellar-node-example'),application:'../examples/node',entry:'dist/app.js',files:['dist','package.json','package-lock.json','node_modules']}));
          JS
          node tools/javascript/node-package.mjs .cellar/node-delivery.json .cellar/node-delivery
          .cellar/node-delivery/launch.sh --help
          CELLAR_TEST_NODE_ENTRY="$PWD/.cellar/node-delivery/app/dist/app.js" CELLAR_TEST_NODE_EXECUTABLE="$PWD/.cellar/node-delivery/bin/node" cargo test --locked -p cellar-javascript --no-default-features --features node --test node_runtime
      - name: Node fleet publish, restore and process recovery
        run: |
          node tools/javascript/node-package.mjs --runtime examples/node/runtime.json .cellar/node-runtime
          cargo run --locked -p cellar -- build examples/node/project.json --output .cellar/node-fleet-package
          # Restore from the published archive, without the captured source tree.
          mv .cellar/node-runtime .cellar/node-runtime-captured
          CELLAR_NODE_PACKAGE="$PWD/.cellar/node-fleet-package" cargo test --locked -p cellar-javascript --no-default-features --features node --test fleet_package published_node_package -- --ignored
      - name: Pi agent installed package end to end
        run: |
          node tools/javascript/node-package.mjs --runtime examples/pi-agent/runtime.json .cellar/pi-agent-runtime
          cargo run --locked -p cellar -- build examples/pi-agent/project.json --output .cellar/pi-agent-package
          mv .cellar/pi-agent-runtime .cellar/pi-agent-runtime-captured
          CELLAR_PI_PACKAGE="$PWD/.cellar/pi-agent-package" cargo test --locked -p cellar-javascript --no-default-features --features node --test fleet_package pi_agent_package -- --ignored --nocapture
      - name: Filesystem agent installed package and session recovery
        run: |
          node tools/javascript/node-package.mjs --runtime examples/filesystem-agent/runtime.json .cellar/filesystem-agent-runtime
          cargo run --locked -p cellar -- build examples/filesystem-agent/project.json --output .cellar/filesystem-agent-package
          mv .cellar/filesystem-agent-runtime .cellar/filesystem-agent-runtime-captured
          CELLAR_FS_PACKAGE="$PWD/.cellar/filesystem-agent-package" cargo test --locked -p cellar-javascript --no-default-features --features node --test fleet_package filesystem_agent_package -- --ignored --nocapture
      - name: SDK archive
        run: npm pack ./packages/cellar-sdk --pack-destination .cellar --ignore-scripts
