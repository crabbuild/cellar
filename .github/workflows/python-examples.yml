name: Python application examples

on:
  push:
    paths:
      - '.github/workflows/python-examples.yml'
      - 'examples/python-fastapi/**'
      - 'examples/python-agent/**'
      - 'examples/streaming/**'
      - 'crates/cellar-python/**'
      - 'crates/cellar/**'
      - 'tools/python/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/python-examples.yml'
      - 'examples/python-fastapi/**'
      - 'examples/python-agent/**'
      - 'examples/streaming/**'
      - 'crates/cellar-python/**'
      - 'crates/cellar/**'
      - 'tools/python/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile for both prerequisite capture and packaged hosts
        type: choice
        default: dev
        options: [dev, lab, release]

permissions:
  contents: read

concurrency:
  group: cellar-python-examples-${{ github.ref }}-${{ inputs.profile || 'dev' }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.1
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  fastapi:
    name: FastAPI deployment (${{ matrix.runtime }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: '3.14.5'
            smoke_flags: ''
          - runtime: '3.14.5t'
            smoke_flags: '--expect-free-threaded'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          python -m pip install uv==0.11.19
      - name: Package the application and its Python dependencies
        run: |
          python -B tools/python/test_package_example.py
          mkdir -p "$RUNNER_TEMP/fastapi"
          python examples/python-fastapi/package.py --runtime '${{ matrix.runtime }}' \
            --profile '${{ inputs.profile || 'dev' }}' \
            --prefix "$RUNNER_TEMP/fastapi/environment" --output "$RUNNER_TEMP/fastapi/package"
      - name: Test buffered ASGI boundaries
        run: |
          export PYO3_PYTHON="$(UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/fastapi/environment/runtime" uv python find --managed-python '${{ matrix.runtime }}')"
          PYTHONPATH="$RUNNER_TEMP/fastapi/environment/site" \
            "$PYO3_PYTHON" -B examples/python-fastapi/test_app.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Python SSE and WebSocket example with restart
        run: |
          export PYO3_PYTHON="$(UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/fastapi/environment/runtime" uv python find --managed-python '${{ matrix.runtime }}')"
          python -B examples/streaming/smoke.py --cellar "$CARGO_TARGET_DIR/debug/cellar" --backend python
      - name: Check native and Python routing failure boundaries
        run: |
          python -B examples/python-fastapi/test_ingress.py \
            --cellar "$CARGO_TARGET_DIR/debug/cellar" \
            --project "$RUNNER_TEMP/fastapi/environment/project.json" \
            --output "$RUNNER_TEMP/fastapi/ingress-failure" ${{ matrix.smoke_flags }}
      - name: Restore and exercise the deployed application
        run: |
          cargo run -p cellar --example python-fastapi-deployment --locked -- \
            "$RUNNER_TEMP/fastapi/package" "$RUNNER_TEMP/fastapi" "$(command -v python)" ${{ matrix.smoke_flags }}
      - name: Check performance harness correctness
        run: |
          python -B examples/python-fastapi/perf.py --cellar "$CARGO_TARGET_DIR/debug/cellar" \
            --project "$RUNNER_TEMP/fastapi/environment/project.json" \
            --output "$RUNNER_TEMP/fastapi/perf-smoke" \
            --concurrency 1 8 --repetitions 1 --read-seconds .5 --writes 32
      - name: Check independent-arrival reads, updates and recovery
        run: |
          python -B examples/python-fastapi/test_perf.py
          cargo build -p cellar-python --example python-offered-load --no-default-features --locked
          python -B tools/python/test_offered.py "$CARGO_TARGET_DIR/debug/examples/python-offered-load"
          python - <<'PY' > "$RUNNER_TEMP/fastapi/cpu-pools.txt"
          import os
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise SystemExit('FastAPI affinity qualification requires at least two available CPUs')
          split = len(cpus) // 2
          print(','.join(map(str, cpus[:split])))
          print(','.join(map(str, cpus[split:])))
          PY
          mapfile -t pools < "$RUNNER_TEMP/fastapi/cpu-pools.txt"
          for operation in read update; do
            python -B examples/python-fastapi/offered_perf.py \
              --operation "$operation" \
              --client "$CARGO_TARGET_DIR/debug/examples/python-offered-load" --client-profile dev \
              --cellar "$CARGO_TARGET_DIR/debug/cellar" \
              --project "python=$RUNNER_TEMP/fastapi/environment/project.json" \
              --output "$RUNNER_TEMP/fastapi/offered-$operation-smoke" \
              --host-cpus "${pools[0]}" --client-cpus "${pools[1]}" \
              --rates 100 --duration-ms 500 --warmup-ms 100 --repetitions 1
          done
          python - "$RUNNER_TEMP/fastapi" <<'PYTEST'
          import json, sys
          from pathlib import Path
          for operation in ("read", "update"):
              report = json.loads((Path(sys.argv[1]) / f"offered-{operation}-smoke/results.json").read_text())
              if report["status"] != "complete":
                  raise RuntimeError("incomplete offered-load smoke")
              for case in report["cases"]:
                  for phase in case["phases"]:
                      for name in ("warmup", "measurement"):
                          outcomes = phase[name]["outcomes"]
                          if not outcomes.get("success") or set(outcomes) - {"success", "client_late", "client_capacity"}:
                              raise RuntimeError(f"FastAPI {operation} smoke failed: {outcomes}")
                  if operation == "update" and not sum(row["acknowledged"] for row in case["recovery"]):
                      raise RuntimeError("no acknowledged updates verified after restart")
          PYTEST
      - name: Retain offered-load accounting and recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fastapi-offered-${{ matrix.runtime }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/fastapi/offered-*-smoke/**/*.json
            ${{ runner.temp }}/fastapi/offered-*-smoke/**/*.log
            ${{ runner.temp }}/fastapi/offered-*-smoke/report.md
            !${{ runner.temp }}/fastapi/offered-*-smoke/**/project.json

  agent:
    name: Durable PydanticAI agent (${{ matrix.runtime }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: '3.14.5'
            smoke_flags: ''
          - runtime: '3.14.5t'
            smoke_flags: '--expect-free-threaded'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONDONTWRITEBYTECODE: '1'
      PYDANTIC_AI_NO_BANNER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          python -m pip install uv==0.11.19
      - name: Package the agent with its pinned runtime and dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          python examples/python-agent/package.py --runtime '${{ matrix.runtime }}' \
            --profile '${{ inputs.profile || 'dev' }}' \
            --prefix "$RUNNER_TEMP/agent/environment" --output "$RUNNER_TEMP/agent/package"
      - name: Test durable agent boundaries and real host restart
        run: |
          export PYO3_PYTHON="$(UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/agent/environment/runtime" uv python find --managed-python '${{ matrix.runtime }}')"
          export CELLAR_PYTHON_SITE_PACKAGES="$RUNNER_TEMP/agent/environment/site"
          PYTHONPATH="$CELLAR_PYTHON_SITE_PACKAGES" "$PYO3_PYTHON" -B examples/python-agent/test_app.py
          python -B examples/python-agent/smoke.py --cellar "$CARGO_TARGET_DIR/debug/cellar" \
            --project "$RUNNER_TEMP/agent/environment/project.json" ${{ matrix.smoke_flags }}
