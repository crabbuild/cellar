<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Language handlers retain native invocation authority</title>
<desc id="desc">A native invocation admits Python, V8, or Node handlers. Their bridge calls retain the original context, cancellation, resource bounds, and durability requirements.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 232H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 232H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 298V388" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<g data-panel="Native invocation"><rect x="48" y="166" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="166" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="198" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Native invocation</text><text x="68" y="226" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Domain and activation</text><text x="68" y="249" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Admission and cancellation</text></g>
<g data-panel="Language handler"><rect x="348" y="166" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="166" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="198" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Language handler</text><text x="368" y="226" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">CPython, V8, or Node</text><text x="368" y="249" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Runtime-owned execution</text></g>
<g data-panel="Scoped SDK bridge"><rect x="648" y="166" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="166" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="198" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Scoped SDK bridge</text><text x="668" y="226" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Original invocation context</text><text x="668" y="249" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Bounded values and calls</text></g>
<g data-panel="Native state and output gates"><rect x="348" y="388" width="564" height="116" rx="10" fill="#0f172a"/><rect x="348" y="388" width="564" height="116" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="368" y="420" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Native state and output gates</text><text x="368" y="448" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Cell transactions, routing, recovery, and required durability</text><text x="368" y="471" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">proof</text></g>
<text x="48" y="90" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">TypeScript compiles before execution; runtime-specific release gates remain separate.</text>
<text x="48" y="562" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Runtime selection does not grant new cell authority or extend an expired context.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Language handlers retain native invocation authority</text></svg>
