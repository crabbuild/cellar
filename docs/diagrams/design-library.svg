<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Designs connect contracts to evidence</title>
<desc id="desc">A design defines behavior. Implementation and named acceptance cases connect it to exact-source evidence. Release decisions retain remaining qualification gates.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 216H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 282V356" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
<path d="M348 422H312" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<g data-panel="Design contract"><rect x="48" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="150" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Design contract</text><text x="68" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Required behavior</text><text x="68" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Invariants and failure</text><text x="68" y="256" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">semantics</text></g>
<g data-panel="Implementation"><rect x="348" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="150" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Implementation</text><text x="368" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">SDK and runtime owners</text><text x="368" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Runnable examples and tests</text></g>
<g data-panel="Acceptance"><rect x="648" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="150" width="264" height="132" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="668" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Acceptance</text><text x="668" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Named cases and oracles</text><text x="668" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Exact verification commands</text></g>
<g data-panel="Retained evidence"><rect x="348" y="356" width="564" height="132" rx="10" fill="#0f172a"/><rect x="348" y="356" width="564" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="368" y="388" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Retained evidence</text><text x="368" y="416" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Source and executable identities; workload and topology</text><text x="368" y="439" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Passing checks, failed attempts, and remaining gates</text></g>
<g data-panel="Release decision"><rect x="48" y="356" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="356" width="264" height="132" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="68" y="388" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Release decision</text><text x="68" y="416" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Apply the declared gates</text><text x="68" y="439" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Retain unqualified scope</text></g>
<text x="48" y="90" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">One documentation library; each claim retains its owning source and scope.</text>
<text x="48" y="566" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">A passing component record establishes only its recorded acceptance boundary.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Designs connect contracts to evidence</text></svg>
