<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
<title id="title">Follow a management request</title>
<desc id="desc">The browser authenticates to Console. Console checks fleet permissions, records management operation intent and routes resource work to its authenticated owner. Only the owner opens cell state.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M280 208H360" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M600 208H680" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M480 268V350" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
<path d="M800 268V350" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M360 238H320V320H160V350" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)" stroke-dasharray="7 5"/>
<g data-panel="Browser console"><rect x="40" y="148" width="240" height="120" rx="10" fill="#0f172a"/><rect x="40" y="148" width="240" height="120" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="60" y="180" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Browser console</text><text x="60" y="208" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">In-memory access token</text><text x="60" y="231" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Explicit operator action</text></g>
<g data-panel="Console API"><rect x="360" y="148" width="240" height="120" rx="10" fill="#0f172a"/><rect x="360" y="148" width="240" height="120" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="380" y="180" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Console API</text><text x="380" y="208" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Origin and grant checks</text><text x="380" y="231" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Binding resolution</text></g>
<g data-panel="Cell owner"><rect x="680" y="148" width="240" height="120" rx="10" fill="#0f172a"/><rect x="680" y="148" width="240" height="120" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="700" y="180" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Cell owner</text><text x="700" y="208" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Authenticated route</text><text x="700" y="231" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Authority and proof</text></g>
<g data-panel="Fleet metadata"><rect x="40" y="350" width="240" height="118" rx="10" fill="#0f172a"/><rect x="40" y="350" width="240" height="118" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="60" y="382" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Fleet metadata</text><text x="60" y="410" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Discovery and routing</text><text x="60" y="433" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Object-store records</text></g>
<g data-panel="Console audit DB"><rect x="360" y="350" width="240" height="118" rx="10" fill="#0f172a"/><rect x="360" y="350" width="240" height="118" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="380" y="382" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Console audit DB</text><text x="380" y="410" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Intent and receipts</text><text x="380" y="433" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Separate SQLite file</text></g>
<g data-panel="Cell SQLite"><rect x="680" y="350" width="240" height="118" rx="10" fill="#0f172a"/><rect x="680" y="350" width="240" height="118" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="700" y="382" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Cell SQLite</text><text x="700" y="410" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Resource reads/writes</text><text x="700" y="433" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Opened by its owner</text></g>
<g data-panel="A lost reply needs reconciliation"><rect x="48" y="514" width="864" height="94" rx="10" fill="#0f172a"/><rect x="48" y="514" width="864" height="94" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="68" y="546" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">A lost reply needs reconciliation</text><text x="68" y="574" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Inspect the saved receipt; the browser does not automatically retry mutations.</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">The console routes resource work to its owner and records operation outcomes.</text>
<text x="320" y="190" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="middle">token</text>
<text x="640" y="190" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="middle">signed</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Follow a management request</text></svg>
