<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">Fleet intent, group authority, and node lifecycle</title>
<desc id="desc">Conditional object-store records coordinate intent and capacity. Raft authorizes membership. The node owns exact-process stop, joining, retained return, and resume.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 216H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 282V330H180V386" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M312 452H348" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
<path d="M612 452H648" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<g data-panel="Fleet catalog"><rect x="48" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="150" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Fleet catalog</text><text x="68" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Conditional durable intent</text><text x="68" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Reservations and receipts</text></g>
<g data-panel="Raft group"><rect x="348" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="150" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Raft group</text><text x="368" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Membership and leadership</text><text x="368" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Fresh surviving-voter proof</text></g>
<g data-panel="Node owner"><rect x="648" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="150" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Node owner</text><text x="668" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Exact boot and disk state</text><text x="668" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Quiescence and joined stop</text></g>
<g data-panel="Prepare"><rect x="48" y="386" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="386" width="264" height="132" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="418" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Prepare</text><text x="68" y="446" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Retain accepted work</text><text x="68" y="469" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Exclude new placement</text></g>
<g data-panel="Stop and return"><rect x="348" y="386" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="386" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="368" y="418" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Stop and return</text><text x="368" y="446" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Independent stop consent</text><text x="368" y="469" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Retained engine; fresh boot</text></g>
<g data-panel="Verify and resume"><rect x="648" y="386" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="386" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="668" y="418" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Verify and resume</text><text x="668" y="446" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Renew physical/voter proof</text><text x="668" y="469" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Release only the owned slot</text></g>
<text x="48" y="90" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Selected authority boundaries; grants and live proof checks remain independent.</text>
<text x="48" y="610" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Unknown outcomes retain their receipts and debt; status reads do not advance operations.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Fleet intent, group authority, and node lifecycle</text></svg>
