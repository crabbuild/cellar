<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 586" role="img" aria-labelledby="title desc">
<title id="title">Owned values do not grant cell authority</title>
<desc id="desc">Callers supply Rust values to native codecs and web primitives, which return owned values. The Cellar host separately owns event dispatch, activation authority, resource lifetimes and durability.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="48" y="390" width="864" height="156" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 5"/><text x="66" y="418" fill="#a78bfa" font-size="15" font-weight="600" text-anchor="start">SEPARATE HOST RESPONSIBILITIES</text>
<path d="M312 225H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 225H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<g data-panel="Rust values"><rect x="48" y="154" width="264" height="142" rx="10" fill="#0f172a"/><rect x="48" y="154" width="264" height="142" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="186" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Rust values</text><text x="68" y="214" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Text, bytes and graphs</text><text x="68" y="237" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Caller-owned resource state</text></g>
<g data-panel="Native primitives"><rect x="348" y="154" width="264" height="142" rx="10" fill="#0f172a"/><rect x="348" y="154" width="264" height="142" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="186" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Native primitives</text><text x="368" y="214" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">JSON, RPC and encoding</text><text x="368" y="237" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Crypto, compression and web</text></g>
<g data-panel="Owned results"><rect x="648" y="154" width="264" height="142" rx="10" fill="#0f172a"/><rect x="648" y="154" width="264" height="142" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="668" y="186" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Owned results</text><text x="668" y="214" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Encoded bytes and values</text><text x="668" y="237" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Streams, bodies and forms</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">cellar-native operates on caller-owned data without a JavaScript engine.</text>
<text x="480" y="344" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="middle">Primitives process values; SDK contexts authorize runtime operations.</text>
<text x="76" y="466" fill="#cbd5e1" font-size="19" font-weight="400" text-anchor="start">Invocation dispatch · activation epochs · execution-domain lifetime</text>
<text x="76" y="505" fill="#cbd5e1" font-size="18" font-weight="400" text-anchor="start">Ownership checks · tracked background work · durability and output gates</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Owned values do not grant cell authority</text></svg>
