<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">Publish, prove, then acknowledge</title>
<desc id="desc">Source state and outbox intent commit atomically. Dispatch resumes the obligation and proves append. A subscription leases records without moving its checkpoint. The consumer commits effects with inbox receipts, syncs local durability, then acknowledges the exact batch. Release qualification remains open.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M612 216H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 280V418" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M648 482H612" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M348 482H312" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<g data-panel="1  Source transaction"><rect x="48" y="152" width="264" height="128" rx="10" fill="#0f172a"/><rect x="48" y="152" width="264" height="128" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="68" y="184" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">1  Source transaction</text><text x="68" y="212" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Business state + outbox row</text><text x="68" y="235" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">db.tx / tx.emit</text></g>
<g data-panel="2  Durable dispatch"><rect x="348" y="152" width="264" height="128" rx="10" fill="#0f172a"/><rect x="348" y="152" width="264" height="128" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="184" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">2  Durable dispatch</text><text x="368" y="212" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Resume stored obligation</text><text x="368" y="235" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Prove destination append</text></g>
<g data-panel="3  Stream + lease"><rect x="648" y="152" width="264" height="128" rx="10" fill="#0f172a"/><rect x="648" y="152" width="264" height="128" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="668" y="184" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">3  Stream + lease</text><text x="668" y="212" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Ordered retained records</text><text x="668" y="235" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">next leaves checkpoint</text><text x="668" y="258" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">intact</text></g>
<g data-panel="4  Consumer transaction"><rect x="648" y="418" width="264" height="128" rx="10" fill="#0f172a"/><rect x="648" y="418" width="264" height="128" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="450" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">4  Consumer transaction</text><text x="668" y="478" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Local effect + inbox receipt</text><text x="668" y="501" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Commit in the same database</text></g>
<g data-panel="5  Prove local effects"><rect x="348" y="418" width="264" height="128" rx="10" fill="#0f172a"/><rect x="348" y="418" width="264" height="128" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="450" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">5  Prove local effects</text><text x="368" y="478" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">db.sync().await</text><text x="368" y="501" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Before remote settlement</text></g>
<g data-panel="6  Acknowledge batch"><rect x="48" y="418" width="264" height="128" rx="10" fill="#0f172a"/><rect x="48" y="418" width="264" height="128" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="450" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">6  Acknowledge batch</text><text x="68" y="478" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Exact receipt</text><text x="68" y="501" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Advance stream checkpoint</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Separate the source commit, destination append, consumer effect and checkpoint.</text>
<text x="760" y="350" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="end">subscription.next</text>
<text x="48" y="605" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">A lost acknowledgment can redeliver records. Retained inbox receipts suppress local repeats.</text>
<text x="48" y="640" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">External effects still need receiver idempotency. Open release gates remain in the status ledger.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Publish, prove, then acknowledge</text></svg>
