<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">Consensus execution and proof boundaries</title>
<desc id="desc">The leader executes a command privately. Raft commits its history before publishing the SQLite image. Quorum and S3 output proofs differ; reads select explicit consistency.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 216H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 282V386" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M690 282V332H480V386" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M348 452H312" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M420 282V320H180V386" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<g data-panel="Private command"><rect x="48" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="150" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Private command</text><text x="68" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Exact history and command</text><text x="68" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Leader-owned execution</text></g>
<g data-panel="Raft commit"><rect x="348" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="150" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Raft commit</text><text x="368" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Durable voter history</text><text x="368" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Membership authority</text></g>
<g data-panel="Published image"><rect x="648" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="150" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Published image</text><text x="668" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Committed SQLite and LTX</text><text x="668" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Bound version and receipt</text></g>
<g data-panel="Output proof"><rect x="48" y="386" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="386" width="264" height="132" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="68" y="418" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Output proof</text><text x="68" y="446" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Quorum: voter durability</text><text x="68" y="469" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">S3: verified archive proof</text></g>
<g data-panel="Archive recovery"><rect x="348" y="386" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="386" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="368" y="418" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Archive recovery</text><text x="368" y="446" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Verified image and tail</text><text x="368" y="469" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Retain dependencies</text></g>
<g data-panel="Explicit query"><rect x="648" y="386" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="386" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="668" y="418" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Explicit query</text><text x="668" y="446" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Stale or minimum-version</text><text x="668" y="469" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Strong: fresh quorum barrier</text></g>
<text x="48" y="90" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Conceptual contract; later release and recovery-time qualification remains open.</text>
<text x="48" y="610" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Archive recovery restores state; it cannot restore old votes or authorize quorum loss.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Consensus execution and proof boundaries</text></svg>
