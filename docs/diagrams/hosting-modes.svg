<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">Two hosts, one cell runtime</title>
<desc id="desc">Cellar may serve public HTTP itself or receive requests from an application-owned Axum server through CellarService and an IngressHandle. Both retain Cellar ownership, recovery and output gates.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="40" y="122" width="416" height="334" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="7 5"/><text x="58" y="150" fill="#22d3ee" font-size="15" font-weight="600" text-anchor="start">CELLAR-OWNED PUBLIC HTTP</text>
<rect x="504" y="122" width="416" height="334" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="7 5"/><text x="522" y="150" fill="#34d399" font-size="15" font-weight="600" text-anchor="start">APPLICATION-OWNED AXUM HTTP</text>
<path d="M248 274V338" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M712 274V338" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M248 434V524" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M712 434V524" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<g data-panel="Cellar public listener"><rect x="64" y="178" width="368" height="96" rx="10" fill="#0f172a"/><rect x="64" y="178" width="368" height="96" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="84" y="210" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Cellar public listener</text><text x="84" y="238" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">sdk::Host or Node::start</text></g>
<g data-panel="Axum application"><rect x="64" y="338" width="368" height="96" rx="10" fill="#0f172a"/><rect x="64" y="338" width="368" height="96" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="84" y="370" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Axum application</text><text x="84" y="398" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Registered gateways and handlers</text></g>
<g data-panel="Outer Axum server"><rect x="528" y="178" width="368" height="96" rx="10" fill="#0f172a"/><rect x="528" y="178" width="368" height="96" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="548" y="210" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Outer Axum server</text><text x="548" y="238" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Your routes, listener and shutdown</text></g>
<g data-panel="CellarService"><rect x="528" y="338" width="368" height="96" rx="10" fill="#0f172a"/><rect x="528" y="338" width="368" height="96" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="548" y="370" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">CellarService</text><text x="548" y="398" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">IngressHandle from start_external</text></g>
<g data-panel="Cellar node and durable cells"><rect x="128" y="524" width="704" height="98" rx="10" fill="#0f172a"/><rect x="128" y="524" width="704" height="98" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="148" y="556" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Cellar node and durable cells</text><text x="148" y="584" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Owner routing, activation, SQLite, recovery and output gates</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Choose who serves public HTTP; Cellar retains cell authority and write proof.</text>
<text x="48" y="650" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">The authenticated peer listener stays separate from public HTTP.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Two hosts, one cell runtime</text></svg>
