<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Named Protobuf calls use the native cell path</title>
<desc id="desc">Protobuf declares named methods. Generated clients and server registrations connect calls to namespace bindings, native routing, and typed results.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 216H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 282V382" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<g data-panel="Protobuf contract"><rect x="48" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="150" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Protobuf contract</text><text x="68" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Service and method names</text><text x="68" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Request and response types</text></g>
<g data-panel="Generated bindings"><rect x="348" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="150" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Generated bindings</text><text x="368" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Clients and handlers</text><text x="368" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Registered cell class</text></g>
<g data-panel="Invocation dispatch"><rect x="648" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="150" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Invocation dispatch</text><text x="668" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Namespace and cell identity</text><text x="668" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Admission and native routing</text></g>
<g data-panel="Typed result and effect outcome"><rect x="348" y="382" width="564" height="116" rx="10" fill="#0f172a"/><rect x="348" y="382" width="564" height="116" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="368" y="414" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Typed result and effect outcome</text><text x="368" y="442" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Retain operation identity after an ambiguous mutation reply</text></g>
<text x="48" y="90" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Registration and dispatch are distinct; consult the ledger for delivered API boundaries.</text>
<text x="48" y="558" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">A descriptor names an interface; the originating invocation supplies authority.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Named Protobuf calls use the native cell path</text></svg>
