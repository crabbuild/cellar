<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">Capture SQLite commits and restore state</title>
<desc id="desc">A source SQLite WAL feeds capture into L0 LTX segments. Replica storage retains files and bundles, with compaction and snapshots. Restore or page-on-demand access reconstructs state. Cellar adds ownership fencing and output proof around these mechanics.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M612 216H648" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M780 278V398" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M648 460H612" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M348 460H312" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<g data-panel="SQLite source"><rect x="48" y="154" width="264" height="124" rx="10" fill="#0f172a"/><rect x="48" y="154" width="264" height="124" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="68" y="186" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">SQLite source</text><text x="68" y="214" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Committed WAL data</text><text x="68" y="237" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Cell-local database</text></g>
<g data-panel="WAL capture"><rect x="348" y="154" width="264" height="124" rx="10" fill="#0f172a"/><rect x="348" y="154" width="264" height="124" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="186" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">WAL capture</text><text x="368" y="214" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Capture committed pages</text><text x="368" y="237" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Report the write position</text></g>
<g data-panel="L0 LTX segments"><rect x="648" y="154" width="264" height="124" rx="10" fill="#0f172a"/><rect x="648" y="154" width="264" height="124" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="668" y="186" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">L0 LTX segments</text><text x="668" y="214" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Transaction ranges</text><text x="668" y="237" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Checksummed page data</text></g>
<g data-panel="Replica storage"><rect x="648" y="398" width="264" height="124" rx="10" fill="#0f172a"/><rect x="648" y="398" width="264" height="124" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="430" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Replica storage</text><text x="668" y="458" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Filesystem or object store</text><text x="668" y="481" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Bundles, compaction,</text><text x="668" y="504" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">snapshots</text></g>
<g data-panel="Restore or page in"><rect x="348" y="398" width="264" height="124" rx="10" fill="#0f172a"/><rect x="348" y="398" width="264" height="124" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="430" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Restore or page in</text><text x="368" y="458" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Rebuild a database</text><text x="368" y="481" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Or load pages on demand</text></g>
<g data-panel="Restored SQLite"><rect x="48" y="398" width="264" height="124" rx="10" fill="#0f172a"/><rect x="48" y="398" width="264" height="124" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="68" y="430" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Restored SQLite</text><text x="68" y="458" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Recovered page state</text><text x="68" y="481" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Host validates authority</text></g>
<g data-panel="Capture alone is not a fleet acknowledgment"><rect x="48" y="558" width="864" height="94" rx="10" fill="#0f172a"/><rect x="48" y="558" width="864" height="94" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="68" y="590" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Capture alone is not a fleet acknowledgment</text><text x="68" y="618" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">The host adds ownership, epoch fencing, log recovery and output proof.</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">cellar-ltx supplies replication mechanics; the host decides when a write is proven.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Capture SQLite commits and restore state</text></svg>
