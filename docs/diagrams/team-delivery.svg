<text class="label" style="font-size:12.00px" x="185.0" y="440" text-anchor="middle">Incidents and changed assumptions</text></g><text class="title" x="40" y="45">Teams: evidence travels with the release</text><text class="subtitle" x="40" y="77">Proposed ownership loop · a passing build is one input to a go/no-go decision</text><text class="label" x="40" y="556">Each boundary needs a named owner, versioned contract and reviewable evidence.</text><text class="label" x="40" y="588">Failed qualification remains visible. Runtime observations feed the next contract and test.</text></svg>
