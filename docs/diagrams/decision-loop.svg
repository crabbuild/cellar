<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">Decisions stay in the pure core</title>
<desc id="desc">A serial actor owns State and calls on_event. It executes returned effects through adapters. Adapters submit versioned completion events through the actor mailbox.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M300 230H350" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M610 230H660" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
<path d="M790 290V390H170V290" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<g data-panel="Serial actor"><rect x="40" y="170" width="260" height="120" rx="10" fill="#0f172a"/><rect x="40" y="170" width="260" height="120" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="60" y="202" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Serial actor</text><text x="60" y="230" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Owns State</text><text x="60" y="253" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Serializes mailbox events</text></g>
<g data-panel="on_event"><rect x="350" y="170" width="260" height="120" rx="10" fill="#0f172a"/><rect x="350" y="170" width="260" height="120" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="370" y="202" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">on_event</text><text x="370" y="230" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Pure state transitions</text><text x="370" y="253" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Returns Effect values</text></g>
<g data-panel="Effect adapters"><rect x="660" y="170" width="260" height="120" rx="10" fill="#0f172a"/><rect x="660" y="170" width="260" height="120" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="680" y="202" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Effect adapters</text><text x="680" y="230" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Storage and network I/O</text><text x="680" y="253" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Return completion events</text></g>
<g data-panel="No ambient work in the core"><rect x="48" y="446" width="864" height="94" rx="10" fill="#0f172a"/><rect x="48" y="446" width="864" height="94" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="478" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">No ambient work in the core</text><text x="68" y="506" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Supply time, randomness and I/O observations through explicit events.</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">The actor calls the core, executes effects and receives adapter completions.</text>
<text x="480" y="369" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="middle">Versioned completions return through the mailbox.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Decisions stay in the pure core</text></svg>
