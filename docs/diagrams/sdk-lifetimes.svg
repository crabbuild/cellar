<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">An invocation can outlive its response</title>
<desc id="desc">Illustrative overlap: the node domain contains an old generation and a new generation. An event in the old cell activation continues tracked background work after its response and after adoption starts a new generation. This is not a timing or retention guarantee.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="40" y="128" width="880" height="420" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="58" y="156" fill="#94a3b8" font-size="15" font-weight="600" text-anchor="start">NODE EXECUTION DOMAIN: SERVICES, TASKS AND CAPTURED POLICY</text>
<path d="M478 403L478 508" fill="none" stroke="#475569" stroke-dasharray="5 6"/>
<path d="M760 403L760 508" fill="none" stroke="#475569" stroke-dasharray="5 6"/>
<rect x="250" y="202" width="570" height="48" rx="8" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="266" y="232" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Compiled application and pools remain for draining work</text>
<rect x="540" y="272" width="330" height="48" rx="8" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="556" y="302" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Adopted generation serves</text>
<rect x="250" y="352" width="570" height="48" rx="8" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="266" y="382" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Storage authority is bound to this activation epoch</text>
<rect x="300" y="432" width="460" height="48" rx="8" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="316" y="462" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Handler, nested calls and wait_until</text>
<g data-panel="Keep the owning boundary alive"><rect x="48" y="575" width="864" height="94" rx="10" fill="#0f172a"/><rect x="48" y="575" width="864" height="94" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="607" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Keep the owning boundary alive</text><text x="68" y="635" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">A retained handle does not extend authority. Keep host executors alive through join.</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">A new generation may serve while accepted work from the old one drains.</text>
<text x="478" y="528" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">response</text>
<text x="760" y="528" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">event ends</text>
<text x="65" y="231" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Old generation</text>
<text x="65" y="301" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">New generation</text>
<text x="65" y="381" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Cell activation</text>
<text x="65" y="461" fill="#cbd5e1" font-size="16" font-weight="400" text-anchor="start">Event driver</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">An invocation can outlive its response</text></svg>
