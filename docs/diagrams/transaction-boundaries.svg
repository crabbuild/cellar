<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Atomicity stops at the cell database</title>
<desc id="desc">Business state, a command receipt and an outbox obligation commit or roll back in one cell-local transaction. A separate SQL binding and an external API are different transaction boundaries.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="40" y="130" width="416" height="376" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 5"/><text x="58" y="158" fill="#a78bfa" font-size="15" font-weight="600" text-anchor="start">CURRENT CELL: ONE db.tx TRANSACTION</text>
<path d="M500 145L500 500" fill="none" stroke="#475569" stroke-dasharray="5 6"/>
<g data-panel="Business state"><rect x="64" y="188" width="368" height="76" rx="10" fill="#0f172a"/><rect x="64" y="188" width="368" height="76" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="84" y="220" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Business state</text></g>
<g data-panel="Command receipt"><rect x="64" y="292" width="368" height="76" rx="10" fill="#0f172a"/><rect x="64" y="292" width="368" height="76" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="84" y="324" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Command receipt</text></g>
<g data-panel="Outbox obligation"><rect x="64" y="396" width="368" height="76" rx="10" fill="#0f172a"/><rect x="64" y="396" width="368" height="76" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="84" y="428" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Outbox obligation</text></g>
<g data-panel="Separate SQL binding"><rect x="544" y="162" width="368" height="130" rx="10" fill="#0f172a"/><rect x="544" y="162" width="368" height="130" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="564" y="194" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Separate SQL binding</text><text x="564" y="222" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Another database</text><text x="564" y="245" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Its own transaction boundary</text></g>
<g data-panel="External API"><rect x="544" y="358" width="368" height="130" rx="10" fill="#0f172a"/><rect x="544" y="358" width="368" height="130" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="564" y="390" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">External API</text><text x="564" y="418" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Remote side effect</text><text x="564" y="441" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Receiver idempotency or reconciliation</text></g>
<g data-panel="Commit together, or roll back together"><rect x="48" y="534" width="864" height="94" rx="10" fill="#0f172a"/><rect x="48" y="534" width="864" height="94" rx="10" fill="#3d3020" stroke="#fbbf24" stroke-width="1.5"/><text x="68" y="566" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Commit together, or roll back together</text><text x="68" y="594" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">tx.emit records local intent; delivery happens after the transaction commits.</text></g>
<text x="48" y="89" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Group related local changes; coordinate separate databases and external effects explicitly.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Atomicity stops at the cell database</text></svg>
