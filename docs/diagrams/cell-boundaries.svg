<text class="label" style="font-size:12.00px" x="600.0" y="630" text-anchor="middle">Intent, retry, compensation</text></g><text class="title" x="40" y="45">Cells: local atomicity, explicit coordination</text><text class="subtitle" x="40" y="77">Proposed application model · Cellar does not establish a global ACID transaction</text><text class="label" x="55" y="178">TRANSACTION BOUNDARY A</text><text class="label" x="765" y="178">TRANSACTION BOUNDARY B</text><text class="label" x="40" y="685">State invariants stay local. Cross-cell and external effects require an application protocol.</text></svg>
