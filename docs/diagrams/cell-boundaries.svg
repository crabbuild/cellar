<text class="label" style="font-size:12.00px" x="245.0" y="250" text-anchor="middle">tenant / order identity</text></g><g ><rect x="800" y="200" width="310" height="90" rx="7" fill="#0f172a"/>
<rect class="surface" x="800" y="200" width="310" height="90" rx="7" fill="#14392f" stroke="#34d399" stroke-width="1.5"/>
<text class="name" style="font-size:16.00px" x="955.0" y="229" text-anchor="middle">Inventory cell</text>
<text class="label" style="font-size:12.00px" x="955.0" y="250" text-anchor="middle">tenant / SKU / location</text></g><g ><rect x="90" y="390" width="310" height="70" rx="7" fill="#0f172a"/>
<rect class="surface" x="90" y="390" width="310" height="70" rx="7" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/>
<text class="name" style="font-size:16.00px" x="245.0" y="419" text-anchor="middle">Order SQLite</text>
<text class="label" style="font-size:12.00px" x="245.0" y="440" text-anchor="middle">State + command receipts</text></g><g ><rect x="800" y="390" width="310" height="70" rx="7" fill="#0f172a"/>
<rect class="surface" x="800" y="390" width="310" height="70" rx="7" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/>
<text class="name" style="font-size:16.00px" x="955.0" y="419" text-anchor="middle">Inventory SQLite</text>
<text class="label" style="font-size:12.00px" x="955.0" y="440" text-anchor="middle">Stock invariant + receipts</text></g><g ><rect x="450" y="580" width="300" height="70" rx="7" fill="#0f172a"/>
