<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Files and business state share the cell transaction</title>
<desc id="desc">An invocation accesses context.fs or tx.fs. File state and business receipts can commit in one SQLite transaction. An explicit barrier or output gate proves durability.</desc>
<defs><marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker><marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{background:#0f172a}</style>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<path d="M312 216H348" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<path d="M612 216H648" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M780 282V382" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
<path d="M180 382V282" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)" stroke-dasharray="7 5"/>
<g data-panel="Invocation"><rect x="48" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="150" width="264" height="132" rx="10" fill="#123343" stroke="#22d3ee" stroke-width="1.5"/><text x="68" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Invocation</text><text x="68" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">context.fs() or tx.fs()</text><text x="68" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Exact handle lifetime</text></g>
<g data-panel="Bounded operation"><rect x="348" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="348" y="150" width="264" height="132" rx="10" fill="#14392f" stroke="#34d399" stroke-width="1.5"/><text x="368" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Bounded operation</text><text x="368" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">POSIX-style SDK controls</text><text x="368" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Paths, quotas, typed errors</text></g>
<g data-panel="Cell SQLite"><rect x="648" y="150" width="264" height="132" rx="10" fill="#0f172a"/><rect x="648" y="150" width="264" height="132" rx="10" fill="#302446" stroke="#a78bfa" stroke-width="1.5"/><text x="668" y="182" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Cell SQLite</text><text x="668" y="210" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">File and business state</text><text x="668" y="233" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Atomic receipt transaction</text></g>
<g data-panel="Optional mount"><rect x="48" y="382" width="264" height="132" rx="10" fill="#0f172a"/><rect x="48" y="382" width="264" height="132" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="68" y="414" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Optional mount</text><text x="68" y="442" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Separate adapter sessions</text><text x="68" y="465" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Separate delivery gates</text></g>
<g data-panel="Configured durability proof"><rect x="348" y="382" width="564" height="132" rx="10" fill="#0f172a"/><rect x="348" y="382" width="564" height="132" rx="10" fill="#3f1c2e" stroke="#fb7185" stroke-width="1.5"/><text x="368" y="414" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="start">Configured durability proof</text><text x="368" y="442" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Commit first; then sync, fsync, or the owning output gate</text><text x="368" y="465" fill="#cbd5e1" font-size="16.5" font-weight="400" text-anchor="start">Handle close or drop does not establish durability</text></g>
<text x="48" y="90" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Core filesystem primitive; the optional FUSE adapter has an independent proposal.</text>
<text x="48" y="602" fill="#cbd5e1" font-size="17" font-weight="400" text-anchor="start">Persist stable operation receipts; reopen handles in each later invocation.</text><text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Files and business state share the cell transaction</text></svg>
